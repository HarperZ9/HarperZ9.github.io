<svg role="img" width="1536" height="864" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" aria-labelledby="task-overrepresentation-title task-overrepresentation-desc" data-figure-kind="matrix">
  <title id="task-overrepresentation-title">Company-reported task measures with separate denominators</title>
  <desc id="task-overrepresentation-desc">Two rows keep OpenAI&apos;s rounded retrospective task measures separate. Previously unsolved tasks were 198 of 898 total tasks, or 22 percent. OpenAI reports that 93 percent of board-discussed tasks came from that set, using a different denominator. OpenAI reports that a previously unsolved task set represented 22 percent of all tasks and 93 percent of board-discussed tasks.</desc>
  <defs>
    <pattern id="task-overrepresentation-verified-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="var(--fg-p)"/><path d="M0 8L8 0" stroke="var(--fg-v)" stroke-width="1"/></pattern>
    <pattern id="task-overrepresentation-caution-pattern" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="var(--fg-p)"/><path d="M-2 10L10-2M4 12L12 4" stroke="var(--fg-l)" stroke-width="1"/></pattern>
    <pattern id="task-overrepresentation-unavailable-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="var(--fg-p)"/><circle cx="2" cy="2" r="1.2" fill="var(--fg-l)"/></pattern>
    <marker id="task-overrepresentation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="var(--fg-l)"/></marker>
  </defs>
  <style>svg{--fg-p:#f1ece1;--fg-i:#16130f;--fg-s:#4a443b;--fg-h:#d6ccb8;--fg-l:#7b7262;--fg-v:#0a6b61;--fg-d:#8f3a19}@media (prefers-color-scheme:dark){svg{--fg-p:#0a0a0d;--fg-i:#ece5d6;--fg-s:#b8b0a0;--fg-h:#262529;--fg-l:#77716a;--fg-v:#63d4ce;--fg-d:#e29472}}:root[data-theme="light"] svg{--fg-p:#f1ece1;--fg-i:#16130f;--fg-s:#4a443b;--fg-h:#d6ccb8;--fg-l:#7b7262;--fg-v:#0a6b61;--fg-d:#8f3a19}:root[data-theme="dark"] svg{--fg-p:#0a0a0d;--fg-i:#ece5d6;--fg-s:#b8b0a0;--fg-h:#262529;--fg-l:#77716a;--fg-v:#63d4ce;--fg-d:#e29472}@media print{svg,:root[data-theme] svg{--fg-p:#ffffff;--fg-i:#000000;--fg-s:#333333;--fg-h:#aaaaaa;--fg-l:#555555;--fg-v:#006b73;--fg-d:#8a3219}}@media (forced-colors:active){svg,:root[data-theme] svg{--fg-p:Canvas;--fg-i:CanvasText;--fg-s:CanvasText;--fg-h:GrayText;--fg-l:CanvasText;--fg-v:CanvasText;--fg-d:CanvasText}}text{paint-order:stroke;stroke:var(--fg-p);stroke-width:5px;stroke-linejoin:round}
    text{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--fg-i)}
    .mono{font-family:"Conso","JetBrains Mono",ui-monospace,"SFMono-Regular",monospace}
    .muted{fill:var(--fg-s)}.hairline{stroke:var(--fg-h);stroke-width:1}.value{font-variant-numeric:tabular-nums}
    [data-figure-point]:focus{outline:none}[data-figure-point]:focus-visible .focus-ring{stroke:var(--fg-v);stroke-width:4;fill:none}
  </style>
  <rect width="960" height="540" fill="var(--fg-p)"/>
  <text x="315" y="76" text-anchor="middle" class="mono" font-size="11">Boundary</text>
<text x="465" y="76" text-anchor="middle" class="mono" font-size="11">Count</text>
<text x="615" y="76" text-anchor="middle" class="mono" font-size="11">Denominator</text>
<text x="765" y="76" text-anchor="middle" class="mono" font-size="11">Reported share</text><text x="220" y="138" text-anchor="end" font-size="13">Board discussed</text>
<g data-figure-point="true" data-figure-key="matrix:board-discussed:boundary" data-status-label="Caution" role="graphics-symbol" aria-label="Board discussed, Boundary: Conditional share. Caution." tabindex="-1">
        <rect class="focus-ring" fill="transparent" x="243" y="103" width="144" height="60" stroke="transparent"/>
        <rect x="245" y="105" width="140" height="56" fill="url(#task-overrepresentation-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.25"/>
        <text x="315" y="137" text-anchor="middle" class="mono" font-size="10">Conditional share</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:board-discussed:count" data-status-label="Unavailable or historical" role="graphics-symbol" aria-label="Board discussed, Count: Not reported. Unavailable or historical." tabindex="-1">
        <rect class="focus-ring" fill="transparent" x="393" y="103" width="144" height="60" stroke="transparent"/>
        <rect x="395" y="105" width="140" height="56" fill="url(#task-overrepresentation-unavailable-pattern)" stroke="var(--fg-l)" stroke-width="1.25"/>
        <text x="465" y="137" text-anchor="middle" class="mono" font-size="10">Not reported</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:board-discussed:denominator" data-status-label="Caution" role="graphics-symbol" aria-label="Board discussed, Denominator: Board-discussed tasks. Caution." tabindex="-1">
        <rect class="focus-ring" fill="transparent" x="543" y="103" width="144" height="60" stroke="transparent"/>
        <rect x="545" y="105" width="140" height="56" fill="url(#task-overrepresentation-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.25"/>
        <text x="615" y="137" text-anchor="middle" class="mono" font-size="10">Board-discussed tasks</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:board-discussed:share" data-status-label="Caution" role="graphics-symbol" aria-label="Board discussed, Reported share: 93%. Caution." tabindex="-1">
        <rect class="focus-ring" fill="transparent" x="693" y="103" width="144" height="60" stroke="transparent"/>
        <rect x="695" y="105" width="140" height="56" fill="url(#task-overrepresentation-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.25"/>
        <text x="765" y="137" text-anchor="middle" class="mono" font-size="10">93%</text>
      </g>
<text x="220" y="204" text-anchor="end" font-size="13">Previously unsolved</text>
<g data-figure-point="true" data-figure-key="matrix:previously-unsolved:boundary" data-status-label="Caution" role="graphics-symbol" aria-label="Previously unsolved, Boundary: All-task share. Caution." tabindex="-1">
        <rect class="focus-ring" fill="transparent" x="243" y="169" width="144" height="60" stroke="transparent"/>
        <rect x="245" y="171" width="140" height="56" fill="url(#task-overrepresentation-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.25"/>
        <text x="315" y="203" text-anchor="middle" class="mono" font-size="10">All-task share</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:previously-unsolved:count" data-status-label="Caution" role="graphics-symbol" aria-label="Previously unsolved, Count: 198 tasks. Caution." tabindex="-1">
        <rect class="focus-ring" fill="transparent" x="393" y="169" width="144" height="60" stroke="transparent"/>
        <rect x="395" y="171" width="140" height="56" fill="url(#task-overrepresentation-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.25"/>
        <text x="465" y="203" text-anchor="middle" class="mono" font-size="10">198 tasks</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:previously-unsolved:denominator" data-status-label="Caution" role="graphics-symbol" aria-label="Previously unsolved, Denominator: 898 total tasks. Caution." tabindex="-1">
        <rect class="focus-ring" fill="transparent" x="543" y="169" width="144" height="60" stroke="transparent"/>
        <rect x="545" y="171" width="140" height="56" fill="url(#task-overrepresentation-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.25"/>
        <text x="615" y="203" text-anchor="middle" class="mono" font-size="10">898 total tasks</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:previously-unsolved:share" data-status-label="Caution" role="graphics-symbol" aria-label="Previously unsolved, Reported share: 22%. Caution." tabindex="-1">
        <rect class="focus-ring" fill="transparent" x="693" y="169" width="144" height="60" stroke="transparent"/>
        <rect x="695" y="171" width="140" height="56" fill="url(#task-overrepresentation-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.25"/>
        <text x="765" y="203" text-anchor="middle" class="mono" font-size="10">22%</text>
      </g><text x="28" y="510" class="mono muted" font-size="11">Cells use text, pattern, and outline in addition to color.</text>
</svg>
