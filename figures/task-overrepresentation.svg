<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" aria-labelledby="task-overrepresentation-title task-overrepresentation-desc" data-figure-kind="bar">
  <title id="task-overrepresentation-title">Company-reported retrospective task shares</title>
  <desc id="task-overrepresentation-desc">Two zero-baseline bars show OpenAI&apos;s rounded retrospective percentages. Previously unsolved tasks were 22 percent of 898 tasks, while 93 percent of board-discussed tasks came from that set. The measures have different denominators. OpenAI reports that a previously unsolved task set represented 22 percent of all tasks and 93 percent of board-discussed tasks.</desc>
  <defs>
    <pattern id="task-overrepresentation-verified-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#13262b"/><path d="M0 8L8 0" stroke="#54c9d1" stroke-width="2"/></pattern>
    <pattern id="task-overrepresentation-caution-pattern" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#291b18"/><path d="M-2 10L10-2M4 12L12 4" stroke="#d47a5a" stroke-width="2"/></pattern>
    <pattern id="task-overrepresentation-unavailable-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#17252c"/><circle cx="2" cy="2" r="1.2" fill="#9eb8bf"/></pattern>
    <marker id="task-overrepresentation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#9eb8bf"/></marker>
  </defs>
  <style>
    text{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f2f8f8}
    .mono{font-family:"Conso","JetBrains Mono",ui-monospace,"SFMono-Regular",monospace}
    .muted{fill:#b9cbd0}.hairline{stroke:#36505a;stroke-width:1}.value{font-variant-numeric:tabular-nums}
    [data-figure-point]:focus{outline:none}[data-figure-point]:focus-visible .focus-ring{stroke:#54c9d1;stroke-width:4;fill:none}
  </style>
  <rect width="960" height="540" fill="#0b1115"/>
  <text x="28" y="38" class="mono muted" font-size="12">VALUE / company-reported percent</text><line x1="190.00" y1="54" x2="190.00" y2="500" stroke="#9eb8bf" stroke-dasharray="3 5"/><g data-figure-point data-figure-key="bar:0" data-status-label="Caution" role="graphics-symbol" aria-label="Board-discussed tasks from that set | separate denominator: 93 company-reported percent. Caution." tabindex="-1">
      <rect class="focus-ring" x="18" y="62" width="914" height="64" rx="2" stroke="transparent"/>
      <text x="28" y="88" font-size="15">Board-discussed tasks from that set | separate denominator</text>
      <line x1="190" y1="95" x2="890" y2="95" class="hairline"/>
      <rect x="190.00" y="75" width="651.00" height="28" fill="url(#task-overrepresentation-caution-pattern)" stroke="#d47a5a"/>
      <text x="900" y="94" text-anchor="end" class="mono value" font-size="13">93 company-reported percent</text>
    </g>
<g data-figure-point data-figure-key="bar:1" data-status-label="Caution" role="graphics-symbol" aria-label="Previously unsolved tasks | 198 of 898: 22 company-reported percent. Caution." tabindex="-1">
      <rect class="focus-ring" x="18" y="134" width="914" height="64" rx="2" stroke="transparent"/>
      <text x="28" y="160" font-size="15">Previously unsolved tasks | 198 of 898</text>
      <line x1="190" y1="167" x2="890" y2="167" class="hairline"/>
      <rect x="190.00" y="147" width="154.00" height="28" fill="url(#task-overrepresentation-caution-pattern)" stroke="#d47a5a"/>
      <text x="900" y="166" text-anchor="end" class="mono value" font-size="13">22 company-reported percent</text>
    </g>
</svg>
