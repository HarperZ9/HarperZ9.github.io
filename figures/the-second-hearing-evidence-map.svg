<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="617" viewBox="0 0 1200 617" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. Four experiments, four different outcomes</title>
<desc id="desc">Four rows compare studies of liking, shared EEG timing, memory interference, and perceptual models. Their samples, exposure schedules, and units differ, so effect magnitudes cannot be compared.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="617" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 1. Four experiments, four different outcomes</tspan></text>
<text x="24.0" y="76.0" text-anchor="start" class="cell"><tspan x="24.0" y="76.0">Repeated listening research uses different exposure schedules and outcome units, so the reported effects</tspan><tspan x="24.0" dy="21">answer different questions.</tspan></text>
<text x="120.0" y="150.0" text-anchor="middle" class="head"><tspan x="120.0" y="150.0">Study</tspan></text><text x="312.0" y="150.0" text-anchor="middle" class="head"><tspan x="312.0" y="150.0">Scope and</tspan><tspan x="312.0" dy="20">denominator</tspan></text><text x="504.0" y="150.0" text-anchor="middle" class="head"><tspan x="504.0" y="150.0">Exposure schedule</tspan></text><text x="696.0" y="150.0" text-anchor="middle" class="head"><tspan x="696.0" y="150.0">Outcome unit</tspan></text><text x="888.0" y="150.0" text-anchor="middle" class="head"><tspan x="888.0" y="150.0">Reported result</tspan></text><text x="1080.0" y="150.0" text-anchor="middle" class="head"><tspan x="1080.0" y="150.0">Non-proof</tspan></text>
<rect class="data-row" x="24" y="189.0" width="1152" height="81" rx="5" fill="#f1eee8"/><text x="120.0" y="213.0" text-anchor="middle" class="cell"><tspan x="120.0" y="213.0">S2</tspan></text><text x="312.0" y="213.0" text-anchor="middle" class="cell"><tspan x="312.0" y="213.0">15 listeners; 40</tspan><tspan x="312.0" dy="19">examples</tspan></text><text x="504.0" y="213.0" text-anchor="middle" class="cell"><tspan x="504.0" y="213.0">Plays 1, 10, 19, 28</tspan><tspan x="504.0" dy="19">over about four</tspan><tspan x="504.0" dy="19">weeks</tspan></text><text x="696.0" y="213.0" text-anchor="middle" class="cell"><tspan x="696.0" y="213.0">Liking rating from 0</tspan><tspan x="696.0" dy="19">to 10</tspan></text><text x="888.0" y="213.0" text-anchor="middle" class="cell"><tspan x="888.0" y="213.0">Liking rose;</tspan><tspan x="888.0" dy="19">omega-squared=0.197</tspan><tspan x="888.0" dy="19">for presentation</tspan></text><text x="1080.0" y="213.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="213.0">No universal</tspan><tspan x="1080.0" dy="19">exposure curve</tspan></text><rect class="data-row" x="24" y="270.0" width="1152" height="119" rx="5" fill="#ffffff"/><text x="120.0" y="294.0" text-anchor="middle" class="cell"><tspan x="120.0" y="294.0">S4</tspan></text><text x="312.0" y="294.0" text-anchor="middle" class="cell"><tspan x="312.0" y="294.0">40 participants in</tspan><tspan x="312.0" dy="19">two cohorts; 8 or 12</tspan><tspan x="312.0" dy="19">excerpts</tspan></text><text x="504.0" y="294.0" text-anchor="middle" class="cell"><tspan x="504.0" y="294.0">Three immediate</tspan><tspan x="504.0" dy="19">repeats per excerpt</tspan></text><text x="696.0" y="294.0" text-anchor="middle" class="cell"><tspan x="696.0" y="294.0">EEG inter-subject</tspan><tspan x="696.0" dy="19">correlation</tspan></text><text x="888.0" y="294.0" text-anchor="middle" class="cell"><tspan x="888.0" y="294.0">Correlation fell for</tspan><tspan x="888.0" dy="19">familiar-style music</tspan><tspan x="888.0" dy="19">and persisted for</tspan><tspan x="888.0" dy="19">unfamiliar-style</tspan><tspan x="888.0" dy="19">music</tspan></text><text x="1080.0" y="294.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="294.0">No validated boredom</tspan><tspan x="1080.0" dy="19">or value measure</tspan></text><rect class="data-row" x="24" y="389.0" width="1152" height="100" rx="5" fill="#f1eee8"/><text x="120.0" y="413.0" text-anchor="middle" class="cell"><tspan x="120.0" y="413.0">S5</tspan></text><text x="312.0" y="413.0" text-anchor="middle" class="cell"><tspan x="312.0" y="413.0">44 participants;</tspan><tspan x="312.0" dy="19">four vocal choruses</tspan></text><text x="504.0" y="413.0" text-anchor="middle" class="cell"><tspan x="504.0" y="413.0">One to four</tspan><tspan x="504.0" dy="19">exposures; test one</tspan><tspan x="504.0" dy="19">day later</tspan></text><text x="696.0" y="413.0" text-anchor="middle" class="cell"><tspan x="696.0" y="413.0">Serial recall and 0</tspan><tspan x="696.0" dy="19">to 100 ratings</tspan></text><text x="888.0" y="413.0" text-anchor="middle" class="cell"><tspan x="888.0" y="413.0">Greater exposure</tspan><tspan x="888.0" dy="19">tended to increase</tspan><tspan x="888.0" dy="19">interference for</tspan><tspan x="888.0" dy="19">some songs</tspan></text><text x="1080.0" y="413.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="413.0">No reliable earworm</tspan><tspan x="1080.0" dy="19">rule</tspan></text><rect class="data-row" x="24" y="489.0" width="1152" height="100" rx="5" fill="#ffffff"/><text x="120.0" y="513.0" text-anchor="middle" class="cell"><tspan x="120.0" y="513.0">S6</tspan></text><text x="312.0" y="513.0" text-anchor="middle" class="cell"><tspan x="312.0" y="513.0">96 recruited; two</tspan><tspan x="312.0" dy="19">excluded; 96</tspan><tspan x="312.0" dy="19">excerpts</tspan></text><text x="504.0" y="513.0" text-anchor="middle" class="cell"><tspan x="504.0" y="513.0">Two rating blocks,</tspan><tspan x="504.0" dy="19">not a listening-dose</tspan><tspan x="504.0" dy="19">study</tspan></text><text x="696.0" y="513.0" text-anchor="middle" class="cell"><tspan x="696.0" y="513.0">Five-point ratings</tspan><tspan x="696.0" dy="19">and standardized</tspan><tspan x="696.0" dy="19">model paths</tspan></text><text x="888.0" y="513.0" text-anchor="middle" class="cell"><tspan x="888.0" y="513.0">Perceptual ratings</tspan><tspan x="888.0" dy="19">mediated several</tspan><tspan x="888.0" dy="19">feature-to-liking</tspan><tspan x="888.0" dy="19">paths</tspan></text><text x="1080.0" y="513.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="513.0">No causal exposure</tspan><tspan x="1080.0" dy="19">claim</tspan></text>
</svg>
