<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="759" viewBox="0 0 1200 759" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. What four studies measured</title>
<desc id="desc">Four rows compare studies of liking, shared EEG timing, memory interference and perceptual models. Their samples, exposure schedules and units differ, so the sizes of their effects cannot be compared.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="759" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 1. What four studies measured</tspan></text>
<text x="24.0" y="76.0" text-anchor="start" class="cell"><tspan x="24.0" y="76.0">Each study measured a different outcome, in its own units and on its own schedule, so the results answer</tspan><tspan x="24.0" dy="21">different questions.</tspan></text>
<text x="120.0" y="150.0" text-anchor="middle" class="head"><tspan x="120.0" y="150.0">Study</tspan></text><text x="312.0" y="150.0" text-anchor="middle" class="head"><tspan x="312.0" y="150.0">Listeners and music</tspan></text><text x="504.0" y="150.0" text-anchor="middle" class="head"><tspan x="504.0" y="150.0">How often heard</tspan></text><text x="696.0" y="150.0" text-anchor="middle" class="head"><tspan x="696.0" y="150.0">What was measured</tspan></text><text x="888.0" y="150.0" text-anchor="middle" class="head"><tspan x="888.0" y="150.0">What was found</tspan></text><text x="1080.0" y="150.0" text-anchor="middle" class="head"><tspan x="1080.0" y="150.0">What it cannot show</tspan></text>
<rect class="data-row" x="24" y="179.0" width="1152" height="157" rx="5" fill="#f1eee8"/><text x="120.0" y="203.0" text-anchor="middle" class="cell"><tspan x="120.0" y="203.0">S2</tspan></text><text x="312.0" y="203.0" text-anchor="middle" class="cell"><tspan x="312.0" y="203.0">2017 liking study:</tspan><tspan x="312.0" dy="19">15 listeners; 40</tspan><tspan x="312.0" dy="19">examples</tspan></text><text x="504.0" y="203.0" text-anchor="middle" class="cell"><tspan x="504.0" y="203.0">Plays 1, 10, 19 and</tspan><tspan x="504.0" dy="19">28 over about four</tspan><tspan x="504.0" dy="19">weeks</tspan></text><text x="696.0" y="203.0" text-anchor="middle" class="cell"><tspan x="696.0" y="203.0">Liking rating from 0</tspan><tspan x="696.0" dy="19">to 10</tspan></text><text x="888.0" y="203.0" text-anchor="middle" class="cell"><tspan x="888.0" y="203.0">Liking rose with</tspan><tspan x="888.0" dy="19">more plays</tspan><tspan x="888.0" dy="19">(omega-squared</tspan><tspan x="888.0" dy="19">0.197: plays</tspan><tspan x="888.0" dy="19">accounted for about</tspan><tspan x="888.0" dy="19">a fifth of the</tspan><tspan x="888.0" dy="19">variation)</tspan></text><text x="1080.0" y="203.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="203.0">No universal</tspan><tspan x="1080.0" dy="19">exposure curve</tspan></text><rect class="data-row" x="24" y="336.0" width="1152" height="138" rx="5" fill="#ffffff"/><text x="120.0" y="360.0" text-anchor="middle" class="cell"><tspan x="120.0" y="360.0">S4</tspan></text><text x="312.0" y="360.0" text-anchor="middle" class="cell"><tspan x="312.0" y="360.0">2019 brain-recording</tspan><tspan x="312.0" dy="19">study: 40</tspan><tspan x="312.0" dy="19">participants in two</tspan><tspan x="312.0" dy="19">groups; 8 or 12</tspan><tspan x="312.0" dy="19">excerpts</tspan></text><text x="504.0" y="360.0" text-anchor="middle" class="cell"><tspan x="504.0" y="360.0">Three repeats in a</tspan><tspan x="504.0" dy="19">row per excerpt</tspan></text><text x="696.0" y="360.0" text-anchor="middle" class="cell"><tspan x="696.0" y="360.0">How closely</tspan><tspan x="696.0" dy="19">listeners' brain</tspan><tspan x="696.0" dy="19">signals moved</tspan><tspan x="696.0" dy="19">together (EEG)</tspan></text><text x="888.0" y="360.0" text-anchor="middle" class="cell"><tspan x="888.0" y="360.0">Brain-signal</tspan><tspan x="888.0" dy="19">alignment fell for</tspan><tspan x="888.0" dy="19">familiar-style music</tspan><tspan x="888.0" dy="19">and persisted for</tspan><tspan x="888.0" dy="19">unfamiliar-style</tspan><tspan x="888.0" dy="19">music</tspan></text><text x="1080.0" y="360.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="360.0">No validated measure</tspan><tspan x="1080.0" dy="19">of boredom or value</tspan></text><rect class="data-row" x="24" y="474.0" width="1152" height="119" rx="5" fill="#f1eee8"/><text x="120.0" y="498.0" text-anchor="middle" class="cell"><tspan x="120.0" y="498.0">S5</tspan></text><text x="312.0" y="498.0" text-anchor="middle" class="cell"><tspan x="312.0" y="498.0">2023 earworm study:</tspan><tspan x="312.0" dy="19">44 participants;</tspan><tspan x="312.0" dy="19">four sung choruses</tspan></text><text x="504.0" y="498.0" text-anchor="middle" class="cell"><tspan x="504.0" y="498.0">One to four plays;</tspan><tspan x="504.0" dy="19">test one day later</tspan></text><text x="696.0" y="498.0" text-anchor="middle" class="cell"><tspan x="696.0" y="498.0">Recall of items in</tspan><tspan x="696.0" dy="19">order, plus 0 to 100</tspan><tspan x="696.0" dy="19">ratings</tspan></text><text x="888.0" y="498.0" text-anchor="middle" class="cell"><tspan x="888.0" y="498.0">More plays tended to</tspan><tspan x="888.0" dy="19">increase</tspan><tspan x="888.0" dy="19">interference with</tspan><tspan x="888.0" dy="19">recall for some</tspan><tspan x="888.0" dy="19">songs</tspan></text><text x="1080.0" y="498.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="498.0">No reliable earworm</tspan><tspan x="1080.0" dy="19">rule</tspan></text><rect class="data-row" x="24" y="593.0" width="1152" height="138" rx="5" fill="#ffffff"/><text x="120.0" y="617.0" text-anchor="middle" class="cell"><tspan x="120.0" y="617.0">S6</tspan></text><text x="312.0" y="617.0" text-anchor="middle" class="cell"><tspan x="312.0" y="617.0">2024</tspan><tspan x="312.0" dy="19">melody-perception</tspan><tspan x="312.0" dy="19">study: 96 recruited;</tspan><tspan x="312.0" dy="19">two excluded; 96</tspan><tspan x="312.0" dy="19">excerpts</tspan></text><text x="504.0" y="617.0" text-anchor="middle" class="cell"><tspan x="504.0" y="617.0">Two rating blocks;</tspan><tspan x="504.0" dy="19">the number of plays</tspan><tspan x="504.0" dy="19">was not varied</tspan></text><text x="696.0" y="617.0" text-anchor="middle" class="cell"><tspan x="696.0" y="617.0">Five-point ratings,</tspan><tspan x="696.0" dy="19">analyzed with</tspan><tspan x="696.0" dy="19">statistical models</tspan></text><text x="888.0" y="617.0" text-anchor="middle" class="cell"><tspan x="888.0" y="617.0">How listeners</tspan><tspan x="888.0" dy="19">perceived a melody</tspan><tspan x="888.0" dy="19">carried several</tspan><tspan x="888.0" dy="19">links between its</tspan><tspan x="888.0" dy="19">measured features</tspan><tspan x="888.0" dy="19">and liking</tspan></text><text x="1080.0" y="617.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="617.0">No claim that more</tspan><tspan x="1080.0" dy="19">plays cause any</tspan><tspan x="1080.0" dy="19">effect</tspan></text>
</svg>
