<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="695" viewBox="0 0 1200 695" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. A report, a baseline, and a change are different records</title>
<desc id="desc">A table of four studies that followed people over time. In a 2009 study of 122 students, reported growth and measured change were generally unrelated. In a later student study that began with 282 people, 219 to 221 sent back follow-up answers and 214 to 218 were analyzed. Among the 61 to 64 analyzed people who had a trauma, growth they credited to the trauma was not significantly related to measured change, while a look-back rating that did not mention the trauma was related to it. In a study of stem-cell-transplant patients, where completed questionnaires fell from 187 to 91, the two were weakly related overall and not significantly related in three of five areas. In a six-month study that began with 804 adults and collected 32,099 brief daily ratings, reported growth did not predict later change. Each study stands alone. The numbers are not added together, and none predicts one person's recovery.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="695" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 1. A report, a baseline, and a change are different records</tspan></text>
<text x="24.0" y="76.0" text-anchor="start" class="cell"><tspan x="24.0" y="76.0">Four studies that followed people over time compared the growth people credited to the event with the</tspan><tspan x="24.0" dy="21">change researchers measured. Each row keeps its own event, sample, time span, and result, and the rows are</tspan><tspan x="24.0" dy="21">not combined.</tspan></text>
<text x="139.2" y="171.0" text-anchor="middle" class="head"><tspan x="139.2" y="171.0">Study</tspan></text><text x="369.6" y="171.0" text-anchor="middle" class="head"><tspan x="369.6" y="171.0">Who took part, and how</tspan><tspan x="369.6" dy="20">many</tspan></text><text x="600.0" y="171.0" text-anchor="middle" class="head"><tspan x="600.0" y="171.0">What was compared</tspan></text><text x="830.4" y="171.0" text-anchor="middle" class="head"><tspan x="830.4" y="171.0">Result</tspan></text><text x="1060.8" y="171.0" text-anchor="middle" class="head"><tspan x="1060.8" y="171.0">What it does not show</tspan></text>
<rect class="data-row" x="24" y="210.0" width="1152" height="100" rx="5" fill="#f1eee8"/><text x="139.2" y="234.0" text-anchor="middle" class="cell"><tspan x="139.2" y="234.0">S2</tspan></text><text x="369.6" y="234.0" text-anchor="middle" class="cell"><tspan x="369.6" y="234.0">Two-month prospective</tspan><tspan x="369.6" dy="19">study; n=122 event</tspan><tspan x="369.6" dy="19">subgroup</tspan></text><text x="600.0" y="234.0" text-anchor="middle" class="cell"><tspan x="600.0" y="234.0">Growth reported on the</tspan><tspan x="600.0" dy="19">questionnaire versus</tspan><tspan x="600.0" dy="19">measured change in the</tspan><tspan x="600.0" dy="19">matching areas</tspan></text><text x="830.4" y="234.0" text-anchor="middle" class="cell"><tspan x="830.4" y="234.0">Generally unrelated</tspan></text><text x="1060.8" y="234.0" text-anchor="middle" class="cell"><tspan x="1060.8" y="234.0">Does not show that growth</tspan><tspan x="1060.8" dy="19">never happens</tspan></text><rect class="data-row" x="24" y="310.0" width="1152" height="157" rx="5" fill="#ffffff"/><text x="139.2" y="334.0" text-anchor="middle" class="cell"><tspan x="139.2" y="334.0">S3</tspan></text><text x="369.6" y="334.0" text-anchor="middle" class="cell"><tspan x="369.6" y="334.0">Two-wave student study;</tspan><tspan x="369.6" dy="19">n=282 baseline; n=219 to</tspan><tspan x="369.6" dy="19">221 raw follow-up; n=214</tspan><tspan x="369.6" dy="19">to 218 full-sample</tspan><tspan x="369.6" dy="19">analytic; 66 raw event</tspan><tspan x="369.6" dy="19">reports; n=61 to 64</tspan><tspan x="369.6" dy="19">analytic event subset</tspan></text><text x="600.0" y="334.0" text-anchor="middle" class="cell"><tspan x="600.0" y="334.0">Perceived PTG, perceived</tspan><tspan x="600.0" dy="19">general growth, and</tspan><tspan x="600.0" dy="19">measured pre-to-post</tspan><tspan x="600.0" dy="19">change</tspan></text><text x="830.4" y="334.0" text-anchor="middle" class="cell"><tspan x="830.4" y="334.0">Perceived PTG was not</tspan><tspan x="830.4" dy="19">significantly related to</tspan><tspan x="830.4" dy="19">the other two; perceived</tspan><tspan x="830.4" dy="19">general growth was</tspan><tspan x="830.4" dy="19">significantly related to</tspan><tspan x="830.4" dy="19">measured change</tspan></text><text x="1060.8" y="334.0" text-anchor="middle" class="cell"><tspan x="1060.8" y="334.0">Does not reach beyond the</tspan><tspan x="1060.8" dy="19">small group of students</tspan><tspan x="1060.8" dy="19">who had a trauma</tspan></text><rect class="data-row" x="24" y="467.0" width="1152" height="100" rx="5" fill="#f1eee8"/><text x="139.2" y="491.0" text-anchor="middle" class="cell"><tspan x="139.2" y="491.0">S4</tspan></text><text x="369.6" y="491.0" text-anchor="middle" class="cell"><tspan x="369.6" y="491.0">Stem-cell-transplant</tspan><tspan x="369.6" dy="19">study; n=187 first; n=157</tspan><tspan x="369.6" dy="19">second; n=91 third</tspan></text><text x="600.0" y="491.0" text-anchor="middle" class="cell"><tspan x="600.0" y="491.0">Questionnaire at</tspan><tspan x="600.0" dy="19">follow-up versus repeated</tspan><tspan x="600.0" dy="19">measures of the same</tspan><tspan x="600.0" dy="19">areas</tspan></text><text x="830.4" y="491.0" text-anchor="middle" class="cell"><tspan x="830.4" y="491.0">Weakly related overall;</tspan><tspan x="830.4" dy="19">not significantly related</tspan><tspan x="830.4" dy="19">in three of five areas</tspan></text><text x="1060.8" y="491.0" text-anchor="middle" class="cell"><tspan x="1060.8" y="491.0">Gives no estimate for</tspan><tspan x="1060.8" dy="19">other kinds of trauma;</tspan><tspan x="1060.8" dy="19">many patients dropped out</tspan></text><rect class="data-row" x="24" y="567.0" width="1152" height="100" rx="5" fill="#ffffff"/><text x="139.2" y="591.0" text-anchor="middle" class="cell"><tspan x="139.2" y="591.0">S7</tspan></text><text x="369.6" y="591.0" text-anchor="middle" class="cell"><tspan x="369.6" y="591.0">Three waves over six</tspan><tspan x="369.6" dy="19">months; Wave 1 n=804;</tspan><tspan x="369.6" dy="19">32,099 daily assessments</tspan></text><text x="600.0" y="591.0" text-anchor="middle" class="cell"><tspan x="600.0" y="591.0">Perceived growth versus</tspan><tspan x="600.0" dy="19">later change in current</tspan><tspan x="600.0" dy="19">standing and in daily</tspan><tspan x="600.0" dy="19">ratings</tspan></text><text x="830.4" y="591.0" text-anchor="middle" class="cell"><tspan x="830.4" y="591.0">Did not predict later</tspan><tspan x="830.4" dy="19">measured change in the</tspan><tspan x="830.4" dy="19">tested models</tspan></text><text x="1060.8" y="591.0" text-anchor="middle" class="cell"><tspan x="1060.8" y="591.0">Does not cover longer</tspan><tspan x="1060.8" dy="19">periods or every subgroup</tspan></text>
</svg>
