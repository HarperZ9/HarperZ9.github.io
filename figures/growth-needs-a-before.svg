<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. A report, a baseline, and a change are different records</title>
<desc id="desc">Four studies compare retrospective perceived growth with measured change. In a 122-person study the measures were generally unrelated. A later study began with 282 students, collected 219 to 221 raw follow-up measures, used 214 to 218 in full-sample comparisons, and found no significant relation in a trauma-subset analysis of 61 to 64. A stem-cell-transplant study found a weak composite relation with three of five domains not significantly related after attrition from 187 to 91 questionnaires. A six-month study with 804 Wave 1 participants and 32,099 daily assessments found that perceived growth did not predict later observed change. The rows are not pooled and do not predict an individual recovery path.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="645" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 1. A report, a baseline, and a change are different records</tspan></text>
<text x="24.0" y="76.0" text-anchor="start" class="cell"><tspan x="24.0" y="76.0">Prospective studies separate retrospective perceived growth from measured change, while keeping each</tspan><tspan x="24.0" dy="21">event, sample, interval, and outcome distinct.</tspan></text>
<text x="139.2" y="150.0" text-anchor="middle" class="head"><tspan x="139.2" y="150.0">Source</tspan></text><text x="369.6" y="150.0" text-anchor="middle" class="head"><tspan x="369.6" y="150.0">Design and denominator</tspan></text><text x="600.0" y="150.0" text-anchor="middle" class="head"><tspan x="600.0" y="150.0">What was compared</tspan></text><text x="830.4" y="150.0" text-anchor="middle" class="head"><tspan x="830.4" y="150.0">Observed relation</tspan></text><text x="1060.8" y="150.0" text-anchor="middle" class="head"><tspan x="1060.8" y="150.0">Main non-proof</tspan></text>
<rect class="data-row" x="24" y="179.0" width="1152" height="81" rx="5" fill="#f1eee8"/><text x="139.2" y="203.0" text-anchor="middle" class="cell"><tspan x="139.2" y="203.0">S2</tspan></text><text x="369.6" y="203.0" text-anchor="middle" class="cell"><tspan x="369.6" y="203.0">Two-month prospective</tspan><tspan x="369.6" dy="19">study; n=122 event</tspan><tspan x="369.6" dy="19">subgroup</tspan></text><text x="600.0" y="203.0" text-anchor="middle" class="cell"><tspan x="600.0" y="203.0">PTGI retrospective report</tspan><tspan x="600.0" dy="19">versus measured</tspan><tspan x="600.0" dy="19">pre-to-post domain change</tspan></text><text x="830.4" y="203.0" text-anchor="middle" class="cell"><tspan x="830.4" y="203.0">Generally unrelated</tspan></text><text x="1060.8" y="203.0" text-anchor="middle" class="cell"><tspan x="1060.8" y="203.0">No claim that growth</tspan><tspan x="1060.8" dy="19">never occurs</tspan></text><rect class="data-row" x="24" y="260.0" width="1152" height="157" rx="5" fill="#ffffff"/><text x="139.2" y="284.0" text-anchor="middle" class="cell"><tspan x="139.2" y="284.0">S3</tspan></text><text x="369.6" y="284.0" text-anchor="middle" class="cell"><tspan x="369.6" y="284.0">Two-wave student study;</tspan><tspan x="369.6" dy="19">n=282 baseline; n=219 to</tspan><tspan x="369.6" dy="19">221 raw follow-up; n=214</tspan><tspan x="369.6" dy="19">to 218 full-sample</tspan><tspan x="369.6" dy="19">analytic; 66 raw event</tspan><tspan x="369.6" dy="19">reports; n=61 to 64</tspan><tspan x="369.6" dy="19">analytic event subset</tspan></text><text x="600.0" y="284.0" text-anchor="middle" class="cell"><tspan x="600.0" y="284.0">Perceived PTG, measured</tspan><tspan x="600.0" dy="19">change, and reconstructed</tspan><tspan x="600.0" dy="19">past standing</tspan></text><text x="830.4" y="284.0" text-anchor="middle" class="cell"><tspan x="830.4" y="284.0">Perceived PTG was not</tspan><tspan x="830.4" dy="19">significantly related to</tspan><tspan x="830.4" dy="19">the other two change</tspan><tspan x="830.4" dy="19">records</tspan></text><text x="1060.8" y="284.0" text-anchor="middle" class="cell"><tspan x="1060.8" y="284.0">No generalization beyond</tspan><tspan x="1060.8" dy="19">the small student event</tspan><tspan x="1060.8" dy="19">subgroup</tspan></text><rect class="data-row" x="24" y="417.0" width="1152" height="100" rx="5" fill="#f1eee8"/><text x="139.2" y="441.0" text-anchor="middle" class="cell"><tspan x="139.2" y="441.0">S4</tspan></text><text x="369.6" y="441.0" text-anchor="middle" class="cell"><tspan x="369.6" y="441.0">Stem-cell-transplant</tspan><tspan x="369.6" dy="19">study; n=187 first; n=157</tspan><tspan x="369.6" dy="19">second; n=91 third</tspan></text><text x="600.0" y="441.0" text-anchor="middle" class="cell"><tspan x="600.0" y="441.0">PTGI at follow-up versus</tspan><tspan x="600.0" dy="19">repeated domain measures</tspan></text><text x="830.4" y="441.0" text-anchor="middle" class="cell"><tspan x="830.4" y="441.0">Weak composite relation;</tspan><tspan x="830.4" dy="19">three of five paired</tspan><tspan x="830.4" dy="19">domains not significantly</tspan><tspan x="830.4" dy="19">related</tspan></text><text x="1060.8" y="441.0" text-anchor="middle" class="cell"><tspan x="1060.8" y="441.0">No cross-trauma</tspan><tspan x="1060.8" dy="19">prevalence claim;</tspan><tspan x="1060.8" dy="19">attrition remains</tspan><tspan x="1060.8" dy="19">material</tspan></text><rect class="data-row" x="24" y="517.0" width="1152" height="100" rx="5" fill="#ffffff"/><text x="139.2" y="541.0" text-anchor="middle" class="cell"><tspan x="139.2" y="541.0">S7</tspan></text><text x="369.6" y="541.0" text-anchor="middle" class="cell"><tspan x="369.6" y="541.0">Three waves over six</tspan><tspan x="369.6" dy="19">months; Wave 1 n=804;</tspan><tspan x="369.6" dy="19">32,099 daily assessments</tspan></text><text x="600.0" y="541.0" text-anchor="middle" class="cell"><tspan x="600.0" y="541.0">Perceived PTG versus</tspan><tspan x="600.0" dy="19">later current-standing</tspan><tspan x="600.0" dy="19">and aggregated</tspan><tspan x="600.0" dy="19">daily-state change</tspan></text><text x="830.4" y="541.0" text-anchor="middle" class="cell"><tspan x="830.4" y="541.0">Did not predict later</tspan><tspan x="830.4" dy="19">observed change in the</tspan><tspan x="830.4" dy="19">tested models</tspan></text><text x="1060.8" y="541.0" text-anchor="middle" class="cell"><tspan x="1060.8" y="541.0">No conclusion about</tspan><tspan x="1060.8" dy="19">longer horizons or every</tspan><tspan x="1060.8" dy="19">subgroup</tspan></text>
</svg>
