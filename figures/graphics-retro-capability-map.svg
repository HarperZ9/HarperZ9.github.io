<svg role="img" xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" aria-labelledby="graphics-retro-capability-map-title graphics-retro-capability-map-desc" data-figure-kind="relationship">
  <title id="graphics-retro-capability-map-title">Graphics, rendering, retro, and preservation systems</title>
  <desc id="graphics-retro-capability-map-desc">Ten independently described systems. Solid and dashed connections appear only where current code, build configuration, or declared data contracts verify a relationship. The map distinguishes product type from verified dependency, optional integration, and evidence-import relationships.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" class="cm-arrow"/></marker></defs>
  <style>svg{--cm-p:#f1ece1;--cm-i:#16130f;--cm-s:#4a443b;--cm-l:#7b7262}@media (prefers-color-scheme:dark){svg{--cm-p:#0a0a0d;--cm-i:#ece5d6;--cm-s:#b8b0a0;--cm-l:#77716a}}:root[data-theme="light"] svg{--cm-p:#f1ece1;--cm-i:#16130f;--cm-s:#4a443b;--cm-l:#7b7262}:root[data-theme="dark"] svg{--cm-p:#0a0a0d;--cm-i:#ece5d6;--cm-s:#b8b0a0;--cm-l:#77716a}@media print{svg,:root[data-theme] svg{--cm-p:#ffffff;--cm-i:#000000;--cm-s:#333333;--cm-l:#555555}}@media (forced-colors:active){svg,:root[data-theme] svg{--cm-p:Canvas;--cm-i:CanvasText;--cm-s:CanvasText;--cm-l:CanvasText}}text{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--cm-i)}.mono{font-family:"Conso","JetBrains Mono",ui-monospace,monospace}.muted{fill:var(--cm-s)}.cm-node{fill:var(--cm-p)}.cm-edge{fill:none;stroke:var(--cm-l);stroke-width:1.5}.cm-arrow{fill:var(--cm-l)}[data-figure-point]:focus-visible .focus-ring{stroke:var(--cm-i);stroke-width:2}</style>
  <path data-relationship-edge="true" data-edge-type="dependency" d="M710 518 C710 538 250 538 250 558" class="cm-edge" stroke-dasharray="none" marker-end="url(#arrow)"><title>Truth ENB to ENB Runtime Core: native runtime build dependency</title></path>
<path data-relationship-edge="true" data-edge-type="optional-integration" d="M710 518 C710 538 710 538 710 558" class="cm-edge" stroke-dasharray="5 7" marker-end="url(#arrow)"><title>Truth ENB to SkyrimBridge: optional runtime integration</title></path>
<path data-relationship-edge="true" data-edge-type="optional-integration" d="M250 518 C250 538 250 538 250 558" class="cm-edge" stroke-dasharray="5 7" marker-end="url(#arrow)"><title>Elder ENB to ENB Runtime Core: optional native runtime dependency</title></path>
<path data-relationship-edge="true" data-edge-type="optional-integration" d="M250 518 C250 538 710 538 710 558" class="cm-edge" stroke-dasharray="5 7" marker-end="url(#arrow)"><title>Elder ENB to SkyrimBridge: optional runtime integration</title></path>
