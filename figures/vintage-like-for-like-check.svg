<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="598" viewBox="0 0 1200 598" role="img" aria-labelledby="title desc">
<title id="title">Figure 2. The like-for-like check</title>
<desc id="desc">Table of six fields to match before comparing official employment numbers: series identity, reference period, value and units, adjustment status, vintage, and revision stage, each with its question and the mismatch it prevents.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="598" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 2. The like-for-like check</tspan></text>
<text x="24.0" y="76.0" text-anchor="start" class="cell"><tspan x="24.0" y="76.0">Six fields to match before comparing two official employment numbers, with the mismatch each field</tspan><tspan x="24.0" dy="21">prevents.</tspan></text>
<text x="216.0" y="150.0" text-anchor="middle" class="head"><tspan x="216.0" y="150.0">Field to carry</tspan></text><text x="600.0" y="150.0" text-anchor="middle" class="head"><tspan x="600.0" y="150.0">Question to ask</tspan></text><text x="984.0" y="150.0" text-anchor="middle" class="head"><tspan x="984.0" y="150.0">A mismatch can create</tspan></text>
<rect class="data-row" x="24" y="179.0" width="1152" height="62" rx="5" fill="#f1eee8"/><text x="216.0" y="203.0" text-anchor="middle" class="cell"><tspan x="216.0" y="203.0">Series identity and definition</tspan></text><text x="600.0" y="203.0" text-anchor="middle" class="cell"><tspan x="600.0" y="203.0">Is this the same series, scope, geography</tspan><tspan x="600.0" dy="19">and industry definition?</tspan></text><text x="984.0" y="203.0" text-anchor="middle" class="cell"><tspan x="984.0" y="203.0">A resemblance in labels between different</tspan><tspan x="984.0" dy="19">populations or reconstructed categories</tspan></text><rect class="data-row" x="24" y="241.0" width="1152" height="62" rx="5" fill="#ffffff"/><text x="216.0" y="265.0" text-anchor="middle" class="cell"><tspan x="216.0" y="265.0">Reference period</tspan></text><text x="600.0" y="265.0" text-anchor="middle" class="cell"><tspan x="600.0" y="265.0">Do both values describe the same month or</tspan><tspan x="600.0" dy="19">the same change interval?</tspan></text><text x="984.0" y="265.0" text-anchor="middle" class="cell"><tspan x="984.0" y="265.0">A release-date comparison mistaken for an</tspan><tspan x="984.0" dy="19">event-date comparison</tspan></text><rect class="data-row" x="24" y="303.0" width="1152" height="62" rx="5" fill="#f1eee8"/><text x="216.0" y="327.0" text-anchor="middle" class="cell"><tspan x="216.0" y="327.0">Value and units</tspan></text><text x="600.0" y="327.0" text-anchor="middle" class="cell"><tspan x="600.0" y="327.0">Is this a level, a monthly change, a</tspan><tspan x="600.0" dy="19">percentage, an index or a revision amount?</tspan></text><text x="984.0" y="327.0" text-anchor="middle" class="cell"><tspan x="984.0" y="327.0">Arithmetic across unlike quantities</tspan></text><rect class="data-row" x="24" y="365.0" width="1152" height="62" rx="5" fill="#ffffff"/><text x="216.0" y="389.0" text-anchor="middle" class="cell"><tspan x="216.0" y="389.0">Adjustment status</tspan></text><text x="600.0" y="389.0" text-anchor="middle" class="cell"><tspan x="600.0" y="389.0">Are both values seasonally adjusted, or</tspan><tspan x="600.0" dy="19">both not seasonally adjusted?</tspan></text><text x="984.0" y="389.0" text-anchor="middle" class="cell"><tspan x="984.0" y="389.0">A difference caused by separate seasonal</tspan><tspan x="984.0" dy="19">processing</tspan></text><rect class="data-row" x="24" y="427.0" width="1152" height="62" rx="5" fill="#f1eee8"/><text x="216.0" y="451.0" text-anchor="middle" class="cell"><tspan x="216.0" y="451.0">Vintage or release date</tspan></text><text x="600.0" y="451.0" text-anchor="middle" class="cell"><tspan x="600.0" y="451.0">What information was available at each</tspan><tspan x="600.0" dy="19">publication date?</tspan></text><text x="984.0" y="451.0" text-anchor="middle" class="cell"><tspan x="984.0" y="451.0">Hindsight carried into a real-time</tspan><tspan x="984.0" dy="19">evaluation</tspan></text><rect class="data-row" x="24" y="489.0" width="1152" height="81" rx="5" fill="#ffffff"/><text x="216.0" y="513.0" text-anchor="middle" class="cell"><tspan x="216.0" y="513.0">Revision stage</tspan></text><text x="600.0" y="513.0" text-anchor="middle" class="cell"><tspan x="600.0" y="513.0">First, second or third estimate,</tspan><tspan x="600.0" dy="19">preliminary or final benchmark, or</tspan><tspan x="600.0" dy="19">reconstruction?</tspan></text><text x="984.0" y="513.0" text-anchor="middle" class="cell"><tspan x="984.0" y="513.0">An ordinary process stage described as a</tspan><tspan x="984.0" dy="19">new real-world event</tspan></text>
</svg>
