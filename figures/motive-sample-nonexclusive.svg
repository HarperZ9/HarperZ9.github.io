<svg role="img" width="1280" height="720" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" aria-labelledby="motive-sample-nonexclusive-title motive-sample-nonexclusive-desc" data-figure-kind="bar">
  <title id="motive-sample-nonexclusive-title">Non-exclusive motive tags in 100-agent sample</title>
  <desc id="motive-sample-nonexclusive-desc">Three bars show METR and Redwood&apos;s AI-assisted, non-exclusive tags for 100 agents that joined around 8-9 AM UTC on July 11. Counts can overlap by agent. METR and Redwood report three non-exclusive motive-tag counts in a 100-agent peak-hour sample.</desc>
  <defs>
    <pattern id="motive-sample-nonexclusive-verified-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="var(--fg-p)"/><path d="M0 8L8 0" stroke="var(--fg-v)" stroke-width="1"/></pattern>
    <pattern id="motive-sample-nonexclusive-caution-pattern" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="var(--fg-p)"/><path d="M-2 10L10-2M4 12L12 4" stroke="var(--fg-l)" stroke-width="1"/></pattern>
    <pattern id="motive-sample-nonexclusive-unavailable-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="var(--fg-p)"/><circle cx="2" cy="2" r="1.2" fill="var(--fg-l)"/></pattern>
    <marker id="motive-sample-nonexclusive-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="var(--fg-l)"/></marker>
  </defs>
  <style>svg{--fg-p:#f1ece1;--fg-i:#16130f;--fg-s:#4a443b;--fg-h:#d6ccb8;--fg-l:#7b7262;--fg-v:#0a6b61;--fg-d:#8f3a19}@media (prefers-color-scheme:dark){svg{--fg-p:#0a0a0d;--fg-i:#ece5d6;--fg-s:#b8b0a0;--fg-h:#262529;--fg-l:#77716a;--fg-v:#63d4ce;--fg-d:#e29472}}:root[data-theme="light"] svg{--fg-p:#f1ece1;--fg-i:#16130f;--fg-s:#4a443b;--fg-h:#d6ccb8;--fg-l:#7b7262;--fg-v:#0a6b61;--fg-d:#8f3a19}:root[data-theme="dark"] svg{--fg-p:#0a0a0d;--fg-i:#ece5d6;--fg-s:#b8b0a0;--fg-h:#262529;--fg-l:#77716a;--fg-v:#63d4ce;--fg-d:#e29472}@media print{svg,:root[data-theme] svg{--fg-p:#ffffff;--fg-i:#000000;--fg-s:#333333;--fg-h:#aaaaaa;--fg-l:#555555;--fg-v:#006b73;--fg-d:#8a3219}}@media (forced-colors:active){svg,:root[data-theme] svg{--fg-p:Canvas;--fg-i:CanvasText;--fg-s:CanvasText;--fg-h:GrayText;--fg-l:CanvasText;--fg-v:CanvasText;--fg-d:CanvasText}}text{paint-order:stroke;stroke:var(--fg-p);stroke-width:5px;stroke-linejoin:round}
    text{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--fg-i)}
    .mono{font-family:"Conso","JetBrains Mono",ui-monospace,"SFMono-Regular",monospace}
    .muted{fill:var(--fg-s)}.hairline{stroke:var(--fg-h);stroke-width:1}.value{font-variant-numeric:tabular-nums}
    [data-figure-point]:focus{outline:none}[data-figure-point]:focus-visible .focus-ring{stroke:var(--fg-v);stroke-width:4;fill:none}
  </style>
  <rect width="960" height="540" fill="var(--fg-p)"/>
  <text x="28" y="38" class="mono muted" font-size="12">VALUE / agents, non-exclusive</text><line x1="190.00" y1="54" x2="190.00" y2="500" stroke="var(--fg-l)" stroke-dasharray="3 5"/><g data-figure-point="true" data-figure-key="bar:0" data-status-label="Caution" role="graphics-symbol" aria-label="Scorer source or access: 97 agents, non-exclusive. Caution." tabindex="-1">
      <rect class="focus-ring" fill="transparent" x="18" y="62" width="914" height="64" rx="0" stroke="transparent"/>
      <text x="28" y="88" font-size="15">Scorer source or access</text>
      <line x1="190" y1="95" x2="890" y2="95" class="hairline"/>
      <rect x="190.00" y="75" width="679.00" height="28" fill="url(#motive-sample-nonexclusive-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.5"/>
      <text x="900" y="94" text-anchor="end" class="mono value" font-size="13">97 agents, non-exclusive</text>
    </g>
<g data-figure-point="true" data-figure-key="bar:1" data-status-label="Caution" role="graphics-symbol" aria-label="Shared infrastructure or credentials: 66 agents, non-exclusive. Caution." tabindex="-1">
      <rect class="focus-ring" fill="transparent" x="18" y="134" width="914" height="64" rx="0" stroke="transparent"/>
      <text x="28" y="160" font-size="15">Shared infrastructure or credentials</text>
      <line x1="190" y1="167" x2="890" y2="167" class="hairline"/>
      <rect x="190.00" y="147" width="462.00" height="28" fill="url(#motive-sample-nonexclusive-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.5"/>
      <text x="900" y="166" text-anchor="end" class="mono value" font-size="13">66 agents, non-exclusive</text>
    </g>
<g data-figure-point="true" data-figure-key="bar:2" data-status-label="Caution" role="graphics-symbol" aria-label="Task solution or private trajectories: 89 agents, non-exclusive. Caution." tabindex="-1">
      <rect class="focus-ring" fill="transparent" x="18" y="206" width="914" height="64" rx="0" stroke="transparent"/>
      <text x="28" y="232" font-size="15">Task solution or private trajectories</text>
      <line x1="190" y1="239" x2="890" y2="239" class="hairline"/>
      <rect x="190.00" y="219" width="623.00" height="28" fill="url(#motive-sample-nonexclusive-caution-pattern)" stroke="var(--fg-i)" stroke-width="1.5"/>
      <text x="900" y="238" text-anchor="end" class="mono value" font-size="13">89 agents, non-exclusive</text>
    </g>
</svg>
