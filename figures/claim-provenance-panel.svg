        <rect x="245" y="237" width="140" height="56" fill="url(#claim-provenance-panel-caution-pattern)" stroke="#d47a5a" stroke-width="1.25"/>
        <text x="315" y="269" text-anchor="middle" class="mono" font-size="10">Host-controlled data</text>
