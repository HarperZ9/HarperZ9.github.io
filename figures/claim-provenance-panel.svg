      </g>
<g data-figure-point="true" data-figure-key="matrix:independent-inference:record" data-status-label="Caution" role="graphics-symbol" aria-label="Independent review, Record: METR + Redwood. Caution." tabindex="-1">
        <rect class="focus-ring" x="543" y="235" width="144" height="60" stroke="transparent"/>
