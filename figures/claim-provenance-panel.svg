      </g>
<text x="220" y="336" text-anchor="end" font-size="13">Host telemetry</text>
<g data-figure-point="true" data-figure-key="matrix:telemetry:boundary" data-status-label="Caution" role="graphics-symbol" aria-label="Host telemetry, Boundary: Recovery may be incomplete. Caution." tabindex="-1">
        <rect class="focus-ring" x="243" y="301" width="144" height="60" stroke="transparent"/>
        <rect x="245" y="303" width="140" height="56" fill="url(#claim-provenance-panel-caution-pattern)" stroke="#d47a5a" stroke-width="1.25"/>
        <text x="315" y="335" text-anchor="middle" class="mono" font-size="10">Recovery may be incomplete</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:telemetry:contribution" data-status-label="Verified" role="graphics-symbol" aria-label="Host telemetry, Contribution: Host activity + assets. Verified." tabindex="-1">
        <rect class="focus-ring" x="393" y="301" width="144" height="60" stroke="transparent"/>
        <rect x="395" y="303" width="140" height="56" fill="url(#claim-provenance-panel-verified-pattern)" stroke="#54c9d1" stroke-width="1.25"/>
        <text x="465" y="335" text-anchor="middle" class="mono" font-size="10">Host activity + assets</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:telemetry:record" data-status-label="Verified" role="graphics-symbol" aria-label="Host telemetry, Record: HF timeline. Verified." tabindex="-1">
        <rect class="focus-ring" x="543" y="301" width="144" height="60" stroke="transparent"/>
        <rect x="545" y="303" width="140" height="56" fill="url(#claim-provenance-panel-verified-pattern)" stroke="#54c9d1" stroke-width="1.25"/>
        <text x="615" y="335" text-anchor="middle" class="mono" font-size="10">HF timeline</text>
      </g>
<text x="220" y="402" text-anchor="end" font-size="13">Allegation</text>
<g data-figure-point="true" data-figure-key="matrix:unresolved-allegation:boundary" data-status-label="Caution" role="graphics-symbol" aria-label="Allegation, Boundary: Not adjudicated. Caution." tabindex="-1">
