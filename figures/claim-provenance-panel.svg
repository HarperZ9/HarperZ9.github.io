<svg role="img" width="1536" height="864" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" aria-labelledby="claim-provenance-panel-title claim-provenance-panel-desc" data-figure-kind="matrix">
  <title id="claim-provenance-panel-title">Claim provenance and evidentiary role</title>
  <desc id="claim-provenance-panel-desc">A five-row panel distinguishes filing, host telemetry, independent inference, company self-report, and unresolved allegation. Each row keeps the record&apos;s contribution adjacent to its boundary and source label. Filing, telemetry, independent inference, company self-report, and unresolved allegation are separate provenance classes in this briefing.</desc>
  <defs>
    <pattern id="claim-provenance-panel-verified-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#13262b"/><path d="M0 8L8 0" stroke="#54c9d1" stroke-width="2"/></pattern>
    <pattern id="claim-provenance-panel-caution-pattern" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#291b18"/><path d="M-2 10L10-2M4 12L12 4" stroke="#d47a5a" stroke-width="2"/></pattern>
    <pattern id="claim-provenance-panel-unavailable-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#17252c"/><circle cx="2" cy="2" r="1.2" fill="#9eb8bf"/></pattern>
    <marker id="claim-provenance-panel-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#9eb8bf"/></marker>
  </defs>
  <style>
    text{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f2f8f8}
    .mono{font-family:"Conso","JetBrains Mono",ui-monospace,"SFMono-Regular",monospace}
    .muted{fill:#b9cbd0}.hairline{stroke:#36505a;stroke-width:1}.value{font-variant-numeric:tabular-nums}
    [data-figure-point]:focus{outline:none}[data-figure-point]:focus-visible .focus-ring{stroke:#54c9d1;stroke-width:4;fill:none}
  </style>
  <rect width="960" height="540" fill="#0b1115"/>
  <text x="315" y="76" text-anchor="middle" class="mono" font-size="11">Boundary</text>
<text x="465" y="76" text-anchor="middle" class="mono" font-size="11">Contribution</text>
<text x="615" y="76" text-anchor="middle" class="mono" font-size="11">Record</text><text x="220" y="138" text-anchor="end" font-size="13">Company report</text>
<g data-figure-point="true" data-figure-key="matrix:company-self-report:boundary" data-status-label="Caution" role="graphics-symbol" aria-label="Company report, Boundary: No independent replication. Caution." tabindex="-1">
        <rect class="focus-ring" x="243" y="103" width="144" height="60" stroke="transparent"/>
        <rect x="245" y="105" width="140" height="56" fill="url(#claim-provenance-panel-caution-pattern)" stroke="#d47a5a" stroke-width="1.25"/>
        <text x="315" y="137" text-anchor="middle" class="mono" font-size="10">No independent replication</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:company-self-report:contribution" data-status-label="Caution" role="graphics-symbol" aria-label="Company report, Contribution: Systems + response. Caution." tabindex="-1">
        <rect class="focus-ring" x="393" y="103" width="144" height="60" stroke="transparent"/>
        <rect x="395" y="105" width="140" height="56" fill="url(#claim-provenance-panel-caution-pattern)" stroke="#d47a5a" stroke-width="1.25"/>
        <text x="465" y="137" text-anchor="middle" class="mono" font-size="10">Systems + response</text>
      </g>
<g data-figure-point="true" data-figure-key="matrix:company-self-report:record" data-status-label="Caution" role="graphics-symbol" aria-label="Company report, Record: OpenAI reports. Caution." tabindex="-1">
        <rect class="focus-ring" x="543" y="103" width="144" height="60" stroke="transparent"/>
        <rect x="545" y="105" width="140" height="56" fill="url(#claim-provenance-panel-caution-pattern)" stroke="#d47a5a" stroke-width="1.25"/>
        <text x="615" y="137" text-anchor="middle" class="mono" font-size="10">OpenAI reports</text>
      </g>
<text x="220" y="204" text-anchor="end" font-size="13">Filing</text>
<g data-figure-point="true" data-figure-key="matrix:filing:boundary" data-status-label="Caution" role="graphics-symbol" aria-label="Filing, Boundary: No liability finding. Caution." tabindex="-1">
