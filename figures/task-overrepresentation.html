        <p class="figure-description">Two rows keep OpenAI&apos;s rounded retrospective task measures separate. Previously unsolved tasks were 198 of 898 total tasks, or 22 percent. OpenAI reports that 93 percent of board-discussed tasks came from that set, using a different denominator.</p>
