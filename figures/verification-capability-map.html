  <section aria-labelledby="verification-capability-map-relationship-records"><h2 id="verification-capability-map-relationship-records">Relationship records</h2><div class="figure-table-wrap"><table class="figure-table"><caption>Text equivalent for every relationship drawn in the figure.</caption><thead><tr><th scope="col">Source</th><th scope="col">Relationship</th><th scope="col">Target</th><th scope="col">Claim scope</th><th scope="col">Evidence</th></tr></thead><tbody><tr data-relationship-row><th scope="row">Engine Revival</th><td>accepts evidence from</td><td>BRender Archival</td><td>Engine Revival can import BRender Archival evidence; neither project is a runtime dependency of the other.</td><td><a href="https://github.com/HarperZ9/engine-revival/blob/0af6d527860a63c418b5775dc0efe9ba89557604/scripts/regenerate_brender_publication_boundary.py#L111-L123" rel="noopener">Engine Revival BRender evidence import boundary</a>; <a href="https://github.com/HarperZ9/engine-revival/releases/tag/v0.1.0" rel="noopener">Engine Revival v0.1.0</a>; <a href="https://github.com/HarperZ9/brender-archival/releases/tag/v0.1.1" rel="noopener">BRender Archival v0.1.1</a></td></tr>
<tr data-relationship-row><th scope="row">Flywheel</th><td>launches as a configured lane</td><td>Accountable Surface</td><td>Flywheel declares Accountable Surface as an actuation lane with additional Coherence Membrane and Proof Surface source roots.</td><td><a href="https://github.com/HarperZ9/flywheel/blob/3b0a1d5e90326edb59ad010ffdb1e1934b96f19a/harness/lanes.py#L100-L107" rel="noopener">Flywheel Accountable Surface lane declaration</a>; <a href="https://github.com/HarperZ9/flywheel/releases/tag/v0.3.10" rel="noopener">Flywheel v0.3.10</a>; <a href="https://github.com/HarperZ9/accountable-surface" rel="noopener">Accountable Surface source 0.1.0</a></td></tr>
