<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="844" viewBox="0 0 1200 844" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. Five benchmark records that look more comparable than they are</title>
<desc id="desc">Table of five benchmark records for March 2025 and March 2026, giving release date, adjustment basis, published revision, whether the official series was updated, and the limit on comparing each row.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="844" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 1. Five benchmark records that look more comparable than they</tspan><tspan x="24.0" dy="32">are</tspan></text>
<text x="24.0" y="108.0" text-anchor="start" class="cell"><tspan x="24.0" y="108.0">Release stage and adjustment basis change what an employment revision means. Each row is a separate</tspan><tspan x="24.0" dy="21">published record, and the rows are not combined.</tspan></text>
<text x="120.0" y="182.0" text-anchor="middle" class="head"><tspan x="120.0" y="182.0">Record</tspan></text><text x="312.0" y="182.0" text-anchor="middle" class="head"><tspan x="312.0" y="182.0">Released</tspan></text><text x="504.0" y="182.0" text-anchor="middle" class="head"><tspan x="504.0" y="182.0">Adjustment basis</tspan></text><text x="696.0" y="182.0" text-anchor="middle" class="head"><tspan x="696.0" y="182.0">Published revision</tspan></text><text x="888.0" y="182.0" text-anchor="middle" class="head"><tspan x="888.0" y="182.0">Did it update the</tspan><tspan x="888.0" dy="20">official series?</tspan></text><text x="1080.0" y="182.0" text-anchor="middle" class="head"><tspan x="1080.0" y="182.0">Comparison boundary</tspan></text>
<rect class="data-row" x="24" y="221.0" width="1152" height="119" rx="5" fill="#f1eee8"/><text x="120.0" y="245.0" text-anchor="middle" class="cell"><tspan x="120.0" y="245.0">March 2025</tspan><tspan x="120.0" dy="19">preliminary</tspan><tspan x="120.0" dy="19">benchmark</tspan></text><text x="312.0" y="245.0" text-anchor="middle" class="cell"><tspan x="312.0" y="245.0">9 September 2025</tspan></text><text x="504.0" y="245.0" text-anchor="middle" class="cell"><tspan x="504.0" y="245.0">Not seasonally</tspan><tspan x="504.0" dy="19">adjusted</tspan></text><text x="696.0" y="245.0" text-anchor="middle" class="cell"><tspan x="696.0" y="245.0">minus 911,000 (minus</tspan><tspan x="696.0" dy="19">0.6 percent)</tspan></text><text x="888.0" y="245.0" text-anchor="middle" class="cell"><tspan x="888.0" y="245.0">No. It previewed the</tspan><tspan x="888.0" dy="19">later benchmark.</tspan></text><text x="1080.0" y="245.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="245.0">Compare with the</tspan><tspan x="1080.0" dy="19">final benchmark</tspan><tspan x="1080.0" dy="19">revision only as a</tspan><tspan x="1080.0" dy="19">change between</tspan><tspan x="1080.0" dy="19">stages.</tspan></text><rect class="data-row" x="24" y="340.0" width="1152" height="100" rx="5" fill="#ffffff"/><text x="120.0" y="364.0" text-anchor="middle" class="cell"><tspan x="120.0" y="364.0">March 2025 final</tspan><tspan x="120.0" dy="19">benchmark revision</tspan></text><text x="312.0" y="364.0" text-anchor="middle" class="cell"><tspan x="312.0" y="364.0">11 February 2026</tspan></text><text x="504.0" y="364.0" text-anchor="middle" class="cell"><tspan x="504.0" y="364.0">Not seasonally</tspan><tspan x="504.0" dy="19">adjusted</tspan></text><text x="696.0" y="364.0" text-anchor="middle" class="cell"><tspan x="696.0" y="364.0">minus 861,000 (minus</tspan><tspan x="696.0" dy="19">0.5 percent)</tspan></text><text x="888.0" y="364.0" text-anchor="middle" class="cell"><tspan x="888.0" y="364.0">Yes, through the</tspan><tspan x="888.0" dy="19">annual benchmark.</tspan></text><text x="1080.0" y="364.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="364.0">The 50,000 change</tspan><tspan x="1080.0" dy="19">from the preliminary</tspan><tspan x="1080.0" dy="19">stage records no new</tspan><tspan x="1080.0" dy="19">employment event.</tspan></text><rect class="data-row" x="24" y="440.0" width="1152" height="157" rx="5" fill="#f1eee8"/><text x="120.0" y="464.0" text-anchor="middle" class="cell"><tspan x="120.0" y="464.0">March 2025 total</tspan><tspan x="120.0" dy="19">revision against the</tspan><tspan x="120.0" dy="19">previously published</tspan><tspan x="120.0" dy="19">estimate</tspan></text><text x="312.0" y="464.0" text-anchor="middle" class="cell"><tspan x="312.0" y="464.0">11 February 2026</tspan></text><text x="504.0" y="464.0" text-anchor="middle" class="cell"><tspan x="504.0" y="464.0">Not seasonally</tspan><tspan x="504.0" dy="19">adjusted</tspan></text><text x="696.0" y="464.0" text-anchor="middle" class="cell"><tspan x="696.0" y="464.0">minus 862,000 (minus</tspan><tspan x="696.0" dy="19">0.5 percent)</tspan></text><text x="888.0" y="464.0" text-anchor="middle" class="cell"><tspan x="888.0" y="464.0">Yes, through the</tspan><tspan x="888.0" dy="19">annual benchmark.</tspan></text><text x="1080.0" y="464.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="464.0">Differs from the</tspan><tspan x="1080.0" dy="19">benchmark revision</tspan><tspan x="1080.0" dy="19">by 1,000 because a</tspan><tspan x="1080.0" dy="19">banking</tspan><tspan x="1080.0" dy="19">reconstruction</tspan><tspan x="1080.0" dy="19">lowered the estimate</tspan><tspan x="1080.0" dy="19">first.</tspan></text><rect class="data-row" x="24" y="597.0" width="1152" height="119" rx="5" fill="#ffffff"/><text x="120.0" y="621.0" text-anchor="middle" class="cell"><tspan x="120.0" y="621.0">March 2025 final</tspan><tspan x="120.0" dy="19">revision</tspan></text><text x="312.0" y="621.0" text-anchor="middle" class="cell"><tspan x="312.0" y="621.0">11 February 2026</tspan></text><text x="504.0" y="621.0" text-anchor="middle" class="cell"><tspan x="504.0" y="621.0">Seasonally adjusted</tspan></text><text x="696.0" y="621.0" text-anchor="middle" class="cell"><tspan x="696.0" y="621.0">minus 898,000 (minus</tspan><tspan x="696.0" dy="19">0.6 percent)</tspan></text><text x="888.0" y="621.0" text-anchor="middle" class="cell"><tspan x="888.0" y="621.0">Yes, in the revised</tspan><tspan x="888.0" dy="19">seasonally adjusted</tspan><tspan x="888.0" dy="19">series.</tspan></text><text x="1080.0" y="621.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="621.0">Do not substitute</tspan><tspan x="1080.0" dy="19">for a not seasonally</tspan><tspan x="1080.0" dy="19">adjusted row;</tspan><tspan x="1080.0" dy="19">seasonal processing</tspan><tspan x="1080.0" dy="19">differs.</tspan></text><rect class="data-row" x="24" y="716.0" width="1152" height="100" rx="5" fill="#f1eee8"/><text x="120.0" y="740.0" text-anchor="middle" class="cell"><tspan x="120.0" y="740.0">March 2026</tspan><tspan x="120.0" dy="19">preliminary</tspan><tspan x="120.0" dy="19">benchmark</tspan></text><text x="312.0" y="740.0" text-anchor="middle" class="cell"><tspan x="312.0" y="740.0">28 August 2026</tspan></text><text x="504.0" y="740.0" text-anchor="middle" class="cell"><tspan x="504.0" y="740.0">Not seasonally</tspan><tspan x="504.0" dy="19">adjusted</tspan></text><text x="696.0" y="740.0" text-anchor="middle" class="cell"><tspan x="696.0" y="740.0">minus 79,000 (minus</tspan><tspan x="696.0" dy="19">0.1 percent)</tspan></text><text x="888.0" y="740.0" text-anchor="middle" class="cell"><tspan x="888.0" y="740.0">No. The final</tspan><tspan x="888.0" dy="19">benchmark is</tspan><tspan x="888.0" dy="19">scheduled for</tspan><tspan x="888.0" dy="19">February 2027.</tspan></text><text x="1080.0" y="740.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="740.0">Preliminary at the</tspan><tspan x="1080.0" dy="19">observation date.</tspan></text>
</svg>
