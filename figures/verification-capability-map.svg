<svg role="img" xmlns="http://www.w3.org/2000/svg" width="1200" height="1316" viewBox="0 0 1200 1316" aria-labelledby="verification-capability-map-title verification-capability-map-desc" data-figure-kind="relationship">
  <title id="verification-capability-map-title">Evaluation and verification systems</title>
  <desc id="verification-capability-map-desc">Systems whose registry record includes evaluation and verification, with only implementation relationships whose endpoints both remain in view. 7 verified typed registry relationships connect two systems in this evaluation-and-verification view. Shared domain placement is taxonomy only. Systems without a line can still be independently useful, and lines can lag code changed after the verification date.</desc>
