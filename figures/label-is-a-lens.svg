<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1102" viewBox="0 0 1200 1102" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. The label is a lens, not a verdict</title>
<desc id="desc">Six studies show that label effects depend on the text, artwork, viewer, setting, and outcome. Descriptive or semantic context sometimes redirected looking or increased reported comprehensibility, while appreciation and interest often stayed unchanged. Broad category labels did not change gaze in two abstract-art experiments. The rows are not pooled and do not establish correct interpretation or artistic value.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="1102" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 1. The label is a lens, not a verdict</tspan></text>
<text x="24.0" y="76.0" text-anchor="start" class="cell"><tspan x="24.0" y="76.0">Label effects vary by text, artwork, viewer, setting, and measured outcome, and cannot be pooled into one</tspan><tspan x="24.0" dy="21">score.</tspan></text>
<text x="120.0" y="150.0" text-anchor="middle" class="head"><tspan x="120.0" y="150.0">Source</tspan></text><text x="312.0" y="150.0" text-anchor="middle" class="head"><tspan x="312.0" y="150.0">Viewer and artwork</tspan><tspan x="312.0" dy="20">denominator</tspan></text><text x="504.0" y="150.0" text-anchor="middle" class="head"><tspan x="504.0" y="150.0">Text intervention</tspan></text><text x="696.0" y="150.0" text-anchor="middle" class="head"><tspan x="696.0" y="150.0">What changed</tspan></text><text x="888.0" y="150.0" text-anchor="middle" class="head"><tspan x="888.0" y="150.0">What did not change</tspan><tspan x="888.0" dy="20">or was not measured</tspan></text><text x="1080.0" y="150.0" text-anchor="middle" class="head"><tspan x="1080.0" y="150.0">Non-proof</tspan></text>
<rect class="data-row" x="24" y="189.0" width="1152" height="195" rx="5" fill="#f1eee8"/><text x="120.0" y="213.0" text-anchor="middle" class="cell"><tspan x="120.0" y="213.0">S1</tspan></text><text x="312.0" y="213.0" text-anchor="middle" class="cell"><tspan x="312.0" y="213.0">30 viewers; 30</tspan><tspan x="312.0" dy="19">works, 15 abstract</tspan><tspan x="312.0" dy="19">and 15 figurative</tspan></text><text x="504.0" y="213.0" text-anchor="middle" class="cell"><tspan x="504.0" y="213.0">Title,</tspan><tspan x="504.0" dy="19">aesthetic-process</tspan><tspan x="504.0" dy="19">context, or semantic</tspan><tspan x="504.0" dy="19">context</tspan></text><text x="696.0" y="213.0" text-anchor="middle" class="cell"><tspan x="696.0" y="213.0">Semantic context</tspan><tspan x="696.0" dy="19">increased abstract</tspan><tspan x="696.0" dy="19">understanding and</tspan><tspan x="696.0" dy="19">salient-region</tspan><tspan x="696.0" dy="19">exploration;</tspan><tspan x="696.0" dy="19">aesthetic-process</tspan><tspan x="696.0" dy="19">context reduced</tspan><tspan x="696.0" dy="19">overall looking time</tspan><tspan x="696.0" dy="19">for abstract work</tspan></text><text x="888.0" y="213.0" text-anchor="middle" class="cell"><tspan x="888.0" y="213.0">Abstract</tspan><tspan x="888.0" dy="19">appreciation was</tspan><tspan x="888.0" dy="19">lower for</tspan><tspan x="888.0" dy="19">aesthetic-process</tspan><tspan x="888.0" dy="19">than semantic</tspan><tspan x="888.0" dy="19">context, but not</tspan><tspan x="888.0" dy="19">reliably different</tspan><tspan x="888.0" dy="19">from title-only</tspan><tspan x="888.0" dy="19">context</tspan></text><text x="1080.0" y="213.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="213.0">No universal label</tspan><tspan x="1080.0" dy="19">effect or correct</tspan><tspan x="1080.0" dy="19">meaning</tspan></text><rect class="data-row" x="24" y="384.0" width="1152" height="138" rx="5" fill="#ffffff"/><text x="120.0" y="408.0" text-anchor="middle" class="cell"><tspan x="120.0" y="408.0">S2</tspan></text><text x="312.0" y="408.0" text-anchor="middle" class="cell"><tspan x="312.0" y="408.0">214 viewers; 31</tspan><tspan x="312.0" dy="19">Pollock works in</tspan><tspan x="312.0" dy="19">Experiment 1</tspan></text><text x="504.0" y="408.0" text-anchor="middle" class="cell"><tspan x="504.0" y="408.0">None, artist,</tspan><tspan x="504.0" dy="19">technique, or</tspan><tspan x="504.0" dy="19">combined information</tspan></text><text x="696.0" y="408.0" text-anchor="middle" class="cell"><tspan x="696.0" y="408.0">Small liking and</tspan><tspan x="696.0" dy="19">interest increase</tspan><tspan x="696.0" dy="19">for combined</tspan><tspan x="696.0" dy="19">information among</tspan><tspan x="696.0" dy="19">lower-art-experience</tspan><tspan x="696.0" dy="19">viewers</tspan></text><text x="888.0" y="408.0" text-anchor="middle" class="cell"><tspan x="888.0" y="408.0">No museum behavior;</tspan><tspan x="888.0" dy="19">order was fixed</tspan></text><text x="1080.0" y="408.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="408.0">No biography-only or</tspan><tspan x="1080.0" dy="19">large general effect</tspan></text><rect class="data-row" x="24" y="522.0" width="1152" height="195" rx="5" fill="#f1eee8"/><text x="120.0" y="546.0" text-anchor="middle" class="cell"><tspan x="120.0" y="546.0">S3</tspan></text><text x="312.0" y="546.0" text-anchor="middle" class="cell"><tspan x="312.0" y="546.0">30 viewers; eight</tspan><tspan x="312.0" dy="19">museum paintings; 20</tspan><tspan x="312.0" dy="19">experimental and 10</tspan><tspan x="312.0" dy="19">control</tspan></text><text x="504.0" y="546.0" text-anchor="middle" class="cell"><tspan x="504.0" y="546.0">Essential then</tspan><tspan x="504.0" dy="19">descriptive labels,</tspan><tspan x="504.0" dy="19">or essential labels</tspan><tspan x="504.0" dy="19">twice</tspan></text><text x="696.0" y="546.0" text-anchor="middle" class="cell"><tspan x="696.0" y="546.0">Viewing,</tspan><tspan x="696.0" dy="19">described-area gaze,</tspan><tspan x="696.0" dy="19">perceived</tspan><tspan x="696.0" dy="19">complexity,</tspan><tspan x="696.0" dy="19">comprehensibility,</tspan><tspan x="696.0" dy="19">positive emotion,</tspan><tspan x="696.0" dy="19">pupil, and</tspan><tspan x="696.0" dy="19">electrodermal</tspan><tspan x="696.0" dy="19">measures</tspan></text><text x="888.0" y="546.0" text-anchor="middle" class="cell"><tspan x="888.0" y="546.0">Appreciation,</tspan><tspan x="888.0" dy="19">interest, curiosity,</tspan><tspan x="888.0" dy="19">and heart rate did</tspan><tspan x="888.0" dy="19">not significantly</tspan><tspan x="888.0" dy="19">change</tspan></text><text x="1080.0" y="546.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="546.0">More looking is not</tspan><tspan x="1080.0" dy="19">more liking</tspan></text><rect class="data-row" x="24" y="717.0" width="1152" height="119" rx="5" fill="#ffffff"/><text x="120.0" y="741.0" text-anchor="middle" class="cell"><tspan x="120.0" y="741.0">S4</tspan></text><text x="312.0" y="741.0" text-anchor="middle" class="cell"><tspan x="312.0" y="741.0">60 enrolled viewers;</tspan><tspan x="312.0" dy="19">49 usable</tspan><tspan x="312.0" dy="19">physiological</tspan><tspan x="312.0" dy="19">records; eight</tspan><tspan x="312.0" dy="19">digital paintings</tspan></text><text x="504.0" y="741.0" text-anchor="middle" class="cell"><tspan x="504.0" y="741.0">Essential versus</tspan><tspan x="504.0" dy="19">descriptive labels</tspan><tspan x="504.0" dy="19">across sessions</tspan></text><text x="696.0" y="741.0" text-anchor="middle" class="cell"><tspan x="696.0" y="741.0">Comprehensibility,</tspan><tspan x="696.0" dy="19">complexity, and</tspan><tspan x="696.0" dy="19">emotional measures</tspan></text><text x="888.0" y="741.0" text-anchor="middle" class="cell"><tspan x="888.0" y="741.0">Liking and interest</tspan><tspan x="888.0" dy="19">did not</tspan><tspan x="888.0" dy="19">significantly change</tspan></text><text x="1080.0" y="741.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="741.0">Digital viewing is</tspan><tspan x="1080.0" dy="19">not a museum visit</tspan></text><rect class="data-row" x="24" y="836.0" width="1152" height="100" rx="5" fill="#f1eee8"/><text x="120.0" y="860.0" text-anchor="middle" class="cell"><tspan x="120.0" y="860.0">S5</tspan></text><text x="312.0" y="860.0" text-anchor="middle" class="cell"><tspan x="312.0" y="860.0">127 viewers; 40</tspan><tspan x="312.0" dy="19">contemporary works</tspan></text><text x="504.0" y="860.0" text-anchor="middle" class="cell"><tspan x="504.0" y="860.0">No title, consistent</tspan><tspan x="504.0" dy="19">title, or</tspan><tspan x="504.0" dy="19">inconsistent title</tspan></text><text x="696.0" y="860.0" text-anchor="middle" class="cell"><tspan x="696.0" y="860.0">Several gaze</tspan><tspan x="696.0" dy="19">measures and their</tspan><tspan x="696.0" dy="19">timing</tspan></text><text x="888.0" y="860.0" text-anchor="middle" class="cell"><tspan x="888.0" y="860.0">Museum behavior and</tspan><tspan x="888.0" dy="19">durable</tspan><tspan x="888.0" dy="19">interpretation were</tspan><tspan x="888.0" dy="19">not measured</tspan></text><text x="1080.0" y="860.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="860.0">Title alignment is</tspan><tspan x="1080.0" dy="19">not truth</tspan></text><rect class="data-row" x="24" y="936.0" width="1152" height="138" rx="5" fill="#ffffff"/><text x="120.0" y="960.0" text-anchor="middle" class="cell"><tspan x="120.0" y="960.0">S6</tspan></text><text x="312.0" y="960.0" text-anchor="middle" class="cell"><tspan x="312.0" y="960.0">52 viewers across</tspan><tspan x="312.0" dy="19">two experiments; 30</tspan><tspan x="312.0" dy="19">abstract works</tspan></text><text x="504.0" y="960.0" text-anchor="middle" class="cell"><tspan x="504.0" y="960.0">Broad categorical</tspan><tspan x="504.0" dy="19">title before viewing</tspan></text><text x="696.0" y="960.0" text-anchor="middle" class="cell"><tspan x="696.0" y="960.0">Gaze shifted from</tspan><tspan x="696.0" dy="19">early scanning to</tspan><tspan x="696.0" dy="19">later survey over</tspan><tspan x="696.0" dy="19">time</tspan></text><text x="888.0" y="960.0" text-anchor="middle" class="cell"><tspan x="888.0" y="960.0">Label did not</tspan><tspan x="888.0" dy="19">reliably change the</tspan><tspan x="888.0" dy="19">measured gaze</tspan><tspan x="888.0" dy="19">pattern; liking and</tspan><tspan x="888.0" dy="19">understanding were</tspan><tspan x="888.0" dy="19">not measured</tspan></text><text x="1080.0" y="960.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="960.0">Broad-label nulls do</tspan><tspan x="1080.0" dy="19">not cover rich</tspan><tspan x="1080.0" dy="19">labels</tspan></text>
</svg>
