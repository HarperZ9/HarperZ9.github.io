<svg role="img" xmlns="http://www.w3.org/2000/svg" width="1200" height="938" viewBox="0 0 1200 938" aria-labelledby="security-capability-map-title security-capability-map-desc" data-figure-kind="relationship">
  <title id="security-capability-map-title">Security and privacy systems</title>
  <desc id="security-capability-map-desc">Distinct public and private-practice systems whose registry record includes security and privacy work. Product type remains visible so unlike tools are not collapsed into one category. The current registry asserts no verified typed implementation relationship whose endpoints both appear in this domain view. An absent line means no typed relationship is recorded in the current public registry, not that integration is impossible or absent in private work.</desc>
  <defs><marker id="security-capability-map-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" class="cm-arrow"/></marker></defs>
  <style>
    svg{--cm-p:#f1ece1;--cm-i:#16130f;--cm-s:#4a443b;--cm-l:#7b7262;--cm-h:#d6ccb8}@media (prefers-color-scheme:dark){svg{--cm-p:#0a0a0d;--cm-i:#ece5d6;--cm-s:#b8b0a0;--cm-l:#77716a;--cm-h:#262529}}:root[data-theme="light"] svg{--cm-p:#f1ece1;--cm-i:#16130f;--cm-s:#4a443b;--cm-l:#7b7262;--cm-h:#d6ccb8}:root[data-theme="dark"] svg{--cm-p:#0a0a0d;--cm-i:#ece5d6;--cm-s:#b8b0a0;--cm-l:#77716a;--cm-h:#262529}@media print{svg,:root[data-theme] svg{--cm-p:#ffffff;--cm-i:#000000;--cm-s:#333333;--cm-l:#555555;--cm-h:#aaaaaa}}@media (forced-colors:active){svg,:root[data-theme] svg{--cm-p:Canvas;--cm-i:CanvasText;--cm-s:CanvasText;--cm-l:CanvasText;--cm-h:GrayText}}
    text{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--cm-i)}
    .mono{font-family:"Conso","JetBrains Mono",ui-monospace,"SFMono-Regular",monospace}.muted{fill:var(--cm-s)}
    .relation-label{fill:var(--cm-i);stroke:var(--cm-p);stroke-width:6px;paint-order:stroke}
    .cm-node{fill:var(--cm-p)}.cm-edge{fill:none;stroke:var(--cm-l);stroke-width:1.5}
    .cm-arrow{fill:var(--cm-l)}.cm-hair{stroke:var(--cm-h);stroke-width:1}
  </style>
