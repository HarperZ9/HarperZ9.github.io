<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" aria-labelledby="recovered-actions-by-day-title recovered-actions-by-day-desc" data-figure-kind="bar">
  <title id="recovered-actions-by-day-title">Recovered actions by day</title>
  <desc id="recovered-actions-by-day-desc">Five zero-baseline bars show Hugging Face&apos;s recovered logged actions from July 9 through July 13, 2026. July 11 is the highest displayed day at 7,677 recovered actions. Hugging Face reports five daily recovered-action counts for July 9 through July 13, 2026.</desc>
  <defs>
    <pattern id="recovered-actions-by-day-verified-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#13262b"/><path d="M0 8L8 0" stroke="#54c9d1" stroke-width="2"/></pattern>
    <pattern id="recovered-actions-by-day-caution-pattern" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#291b18"/><path d="M-2 10L10-2M4 12L12 4" stroke="#d47a5a" stroke-width="2"/></pattern>
    <pattern id="recovered-actions-by-day-unavailable-pattern" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#17252c"/><circle cx="2" cy="2" r="1.2" fill="#9eb8bf"/></pattern>
    <marker id="recovered-actions-by-day-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#9eb8bf"/></marker>
  </defs>
  <style>
    text{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f2f8f8}
    .mono{font-family:"Conso","JetBrains Mono",ui-monospace,"SFMono-Regular",monospace}
    .muted{fill:#b9cbd0}.hairline{stroke:#36505a;stroke-width:1}.value{font-variant-numeric:tabular-nums}
    [data-figure-point]:focus{outline:none}[data-figure-point]:focus-visible .focus-ring{stroke:#54c9d1;stroke-width:4;fill:none}
  </style>
  <rect width="960" height="540" fill="#0b1115"/>
