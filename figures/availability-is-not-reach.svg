<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. Availability is not reach</title>
<desc id="desc">Two separate panels show school availability and student reach. In June 2025, 85 percent of public schools offered some tutoring and 42 percent offered high-dosage tutoring. In October 2024, average high-dosage participation was 8 percent across all public schools and 25 percent within offering schools. The months and denominators differ.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="600" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 1. Availability is not reach</tspan></text>
<text x="24.0" y="76.0" text-anchor="start" class="cell"><tspan x="24.0" y="76.0">Panel A shows the percent of U.S. public schools that offered tutoring in June 2025. Panel B shows the</tspan><tspan x="24.0" dy="21">average percent of each school's students in high-dosage tutoring in October 2024, a different month with</tspan><tspan x="24.0" dy="21">a different base number, so each panel answers its own question.</tspan></text>
<text x="120.0" y="171.0" text-anchor="middle" class="head"><tspan x="120.0" y="171.0">Panel and measure</tspan></text><text x="312.0" y="171.0" text-anchor="middle" class="head"><tspan x="312.0" y="171.0">Estimate</tspan></text><text x="504.0" y="171.0" text-anchor="middle" class="head"><tspan x="504.0" y="171.0">Date</tspan></text><text x="696.0" y="171.0" text-anchor="middle" class="head"><tspan x="696.0" y="171.0">Unit and base number</tspan></text><text x="888.0" y="171.0" text-anchor="middle" class="head"><tspan x="888.0" y="171.0">Margin (standard</tspan><tspan x="888.0" dy="20">error)</tspan></text><text x="1080.0" y="171.0" text-anchor="middle" class="head"><tspan x="1080.0" y="171.0">What it does not</tspan><tspan x="1080.0" dy="20">show</tspan></text>
<rect class="data-row" x="24" y="210.0" width="1152" height="81" rx="5" fill="#f1eee8"/><text x="120.0" y="234.0" text-anchor="middle" class="cell"><tspan x="120.0" y="234.0">A. Schools offering</tspan><tspan x="120.0" dy="19">any tutoring</tspan></text><text x="312.0" y="234.0" text-anchor="middle" class="cell"><tspan x="312.0" y="234.0">85%</tspan></text><text x="504.0" y="234.0" text-anchor="middle" class="cell"><tspan x="504.0" y="234.0">June 2025</tspan></text><text x="696.0" y="234.0" text-anchor="middle" class="cell"><tspan x="696.0" y="234.0">Percent of U.S.</tspan><tspan x="696.0" dy="19">public schools</tspan></text><text x="888.0" y="234.0" text-anchor="middle" class="cell"><tspan x="888.0" y="234.0">0.9 points, for the</tspan><tspan x="888.0" dy="19">15% offering no</tspan><tspan x="888.0" dy="19">tutoring</tspan></text><text x="1080.0" y="234.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="234.0">No delivered dosage</tspan><tspan x="1080.0" dy="19">or impact</tspan></text><rect class="data-row" x="24" y="291.0" width="1152" height="62" rx="5" fill="#ffffff"/><text x="120.0" y="315.0" text-anchor="middle" class="cell"><tspan x="120.0" y="315.0">A. Schools offering</tspan><tspan x="120.0" dy="19">high-dosage tutoring</tspan></text><text x="312.0" y="315.0" text-anchor="middle" class="cell"><tspan x="312.0" y="315.0">42%</tspan></text><text x="504.0" y="315.0" text-anchor="middle" class="cell"><tspan x="504.0" y="315.0">June 2025</tspan></text><text x="696.0" y="315.0" text-anchor="middle" class="cell"><tspan x="696.0" y="315.0">Percent of U.S.</tspan><tspan x="696.0" dy="19">public schools</tspan></text><text x="888.0" y="315.0" text-anchor="middle" class="cell"><tspan x="888.0" y="315.0">1.2 percentage</tspan><tspan x="888.0" dy="19">points</tspan></text><text x="1080.0" y="315.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="315.0">No student</tspan><tspan x="1080.0" dy="19">participation rate</tspan></text><rect class="data-row" x="24" y="353.0" width="1152" height="100" rx="5" fill="#f1eee8"/><text x="120.0" y="377.0" text-anchor="middle" class="cell"><tspan x="120.0" y="377.0">B. Students</tspan><tspan x="120.0" dy="19">receiving</tspan><tspan x="120.0" dy="19">high-dosage tutoring</tspan><tspan x="120.0" dy="19">across all schools</tspan></text><text x="312.0" y="377.0" text-anchor="middle" class="cell"><tspan x="312.0" y="377.0">8%</tspan></text><text x="504.0" y="377.0" text-anchor="middle" class="cell"><tspan x="504.0" y="377.0">October 2024</tspan></text><text x="696.0" y="377.0" text-anchor="middle" class="cell"><tspan x="696.0" y="377.0">Average percent of</tspan><tspan x="696.0" dy="19">enrolled students</tspan><tspan x="696.0" dy="19">per public school</tspan></text><text x="888.0" y="377.0" text-anchor="middle" class="cell"><tspan x="888.0" y="377.0">0.5 percentage</tspan><tspan x="888.0" dy="19">points</tspan></text><text x="1080.0" y="377.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="377.0">No link to June</tspan><tspan x="1080.0" dy="19">availability</tspan></text><rect class="data-row" x="24" y="453.0" width="1152" height="119" rx="5" fill="#ffffff"/><text x="120.0" y="477.0" text-anchor="middle" class="cell"><tspan x="120.0" y="477.0">B. Students</tspan><tspan x="120.0" dy="19">receiving</tspan><tspan x="120.0" dy="19">high-dosage tutoring</tspan><tspan x="120.0" dy="19">within offering</tspan><tspan x="120.0" dy="19">schools</tspan></text><text x="312.0" y="477.0" text-anchor="middle" class="cell"><tspan x="312.0" y="477.0">25%</tspan></text><text x="504.0" y="477.0" text-anchor="middle" class="cell"><tspan x="504.0" y="477.0">October 2024</tspan></text><text x="696.0" y="477.0" text-anchor="middle" class="cell"><tspan x="696.0" y="477.0">Average percent of</tspan><tspan x="696.0" dy="19">enrolled students</tspan><tspan x="696.0" dy="19">within offering</tspan><tspan x="696.0" dy="19">schools</tspan></text><text x="888.0" y="477.0" text-anchor="middle" class="cell"><tspan x="888.0" y="477.0">1.2 percentage</tspan><tspan x="888.0" dy="19">points</tspan></text><text x="1080.0" y="477.0" text-anchor="middle" class="cell"><tspan x="1080.0" y="477.0">No causal learning</tspan><tspan x="1080.0" dy="19">effect</tspan></text>
</svg>
