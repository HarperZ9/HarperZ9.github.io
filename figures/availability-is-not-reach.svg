<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="569" viewBox="0 0 1200 569" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. Availability is not reach</title>
<desc id="desc">Two separate panels show school availability and student reach. In June 2025, 85 percent of public schools offered some tutoring and 42 percent offered high-dosage tutoring. In October 2024, average high-dosage participation was 8 percent across all public schools and 25 percent within offering schools. The months and denominators differ.</desc>
<style>.title{font:700 27px system-ui,sans-serif;fill:#161412}.head{font:650 17px ui-monospace,monospace;fill:#3f3a34}.cell{font:16px system-ui,sans-serif;fill:#161412}</style>
<rect width="1200" height="569" fill="#fbfaf7"/>
<text x="24.0" y="42.0" text-anchor="start" class="title"><tspan x="24.0" y="42.0">Figure 1. Availability is not reach</tspan></text>
<text x="24.0" y="76.0" text-anchor="start" class="cell"><tspan x="24.0" y="76.0">School availability in June 2025 and student reach in October 2024 are separate measures with different</tspan><tspan x="24.0" dy="21">denominators.</tspan></text>
<text x="120.0" y="150.0" text-anchor="middle" class="head"><tspan x="120.0" y="150.0">Panel and measure</tspan></text><text x="312.0" y="150.0" text-anchor="middle" class="head"><tspan x="312.0" y="150.0">Estimate</tspan></text><text x="504.0" y="150.0" text-anchor="middle" class="head"><tspan x="504.0" y="150.0">Date</tspan></text><text x="696.0" y="150.0" text-anchor="middle" class="head"><tspan x="696.0" y="150.0">Unit and denominator</tspan></text><text x="888.0" y="150.0" text-anchor="middle" class="head"><tspan x="888.0" y="150.0">Standard error</tspan></text><text x="1080.0" y="150.0" text-anchor="middle" class="head"><tspan x="1080.0" y="150.0">Non-proof</tspan></text>
