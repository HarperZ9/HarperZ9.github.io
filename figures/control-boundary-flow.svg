<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" aria-labelledby="control-boundary-flow-title control-boundary-flow-desc" data-figure-kind="relationship">
  <title id="control-boundary-flow-title">Conceptual trust boundary and review layers</title>
  <desc id="control-boundary-flow-desc">A conceptual relationship diagram moves from OpenAI&apos;s research environment to reported activity on Hugging Face production systems, then separates host evidence, company response, vendor remediation, independent analysis, and legal review. Every connection uses equal-width geometry. Technical containment, company response, vendor remediation, independent analysis, and legal review are separate layers with different evidence owners.</desc>
