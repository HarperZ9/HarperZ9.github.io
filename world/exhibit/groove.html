<main>
  <div class="top"><h1>The skipping groove</h1><a class="back" href="index.html">We are here</a></div>
  <figure style="margin:0">
    <div class="wrap">
      <div>
        <div id="stage" tabindex="0" role="group" aria-label="A 78 rpm record turning under a needle. The needle catches on a scratch and one bar repeats. Use the button to lift the needle. Hold Shift with the arrow keys to move the attention point that wakes the dots."><canvas id="cv" aria-hidden="true"></canvas><canvas id="dots" aria-hidden="true"></canvas></div>
        <div class="controls"><button type="button" id="lift" aria-pressed="false">Lift the needle</button><button type="button" id="restart">Start the record again</button></div>
        <p id="count" aria-hidden="true"></p><p class="sr" id="live" aria-live="polite"></p>
      </div>
      <div class="side">
        <h2>Four copies of the same bar</h2>
        <p>A copy loses detail every time: the quiet parts go first, then the middle, until the level has three steps. What it keeps, perfectly, is the shape of the injury. The bar that repeats stays a bar that repeats.</p>
        <canvas id="echo" role="img" aria-label="Four waveform rows, the record and three copies of increasing loss. In each, the same bar appears three times in a row, highlighted."></canvas>
        <p class="legend"><b>Pink</b> is the bar that will not let go. The needle lifts and drops, and the groove pulls it back.</p>
        <p>If a loop is what carries you forward, ask whose hand set the groove. Momentum feels like permission, and the permission was cut into the disc before you arrived.</p>
      </div>
    </div>
    <figcaption>FIG. 6. The skipping groove. The audio is a 1919 78 rpm side, "I might be your once-in-a-while", from the Library of Congress National Jukebox through the Internet Archive's Great 78 Project; the label is a Standard Talking Machine Co. disc label and the first gramophone disc, 1897, is a Berliner. The scratch and the repeat are our own. Fear extinction writes a new memory over the old one and does not erase it (Bouton 2004; Quirk and Mueller 2008). <a href="credits.html">Credits</a>.</figcaption>
  </figure>
