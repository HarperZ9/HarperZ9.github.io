<main>
  <div class="top"><h1>By his own hair</h1><a class="back" href="index.html">We are here</a></div>
  <figure style="margin:0">
    <div id="stage" aria-label="Baron Munchhausen over a swamp of dots. Drag up to pull his hair, or use the pull control below."><canvas id="cv" role="img" aria-label="An engraving of the Baron hanging by his own hair above a swamp drawn as dots. The dots below him are empty."></canvas><canvas id="dots" aria-hidden="true"></canvas></div>
    <div id="pull" tabindex="0" role="slider" aria-label="Pull the hair" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Use the up and down arrow keys to pull. Shift with the arrow keys moves the attention point that bends the swamp."><b>Pulled <span id="pct" style="font:inherit;color:inherit">0%</span></b><span>Evidence holding him up: <span id="hold">0</span></span><span>Drag up, or press the up arrow.</span></div>
    <div class="tri">
      <div id="t1" hidden><h2>The circle</h2><p>He is held up by the thing he is trying to prove. A verifier that certifies itself passes every test it wrote.</p></div>
      <div id="t2" hidden><h2>The regress</h2><p>So he asks for a second hand to hold the first. Then a third to hold the second. The chain has no end, and nobody pays to walk it.</p></div>
      <div id="t3" hidden><h2>The stop</h2><p>Or he drives a nail into the sky and says, here, we stop asking. The nail is a decision, and somebody made it.</p></div>
    </div>
    <p id="end" hidden>Don't look at me like that. Mine reads TRUE too. Funny how everybody's does, huh?</p>
    <p class="sr" id="live" aria-live="polite"></p>
    <figcaption>FIG. 9. By his own hair. The Munchhausen trilemma, after Hans Albert (1968) and the older trilemma of Agrippa: every attempt to justify a claim ends in a circle, an infinite regress, or an arbitrary stop. Plates: Theodor Hosemann's illustrations to the Baron Munchhausen tales (1840s) and a Gustave Dore bust, from Wikimedia Commons, public domain. The swamp is a dot field of heights; the point of attention pushes it open. <a href="credits.html">Credits</a>.</figcaption>
  </figure>
