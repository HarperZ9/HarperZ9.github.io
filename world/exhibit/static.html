<main>
  <div class="top"><h1>Between stations</h1><a class="back" href="index.html">We are here</a></div>
  <figure style="margin:0">
    <div id="stage" tabindex="0" role="group" aria-label="A field of dots, like radio static. Turn the dial with the slider, the left and right arrow keys, or by dragging the strip, and an almost-image gathers. Hold Shift with the arrow keys to move the attention point that bends the dots."><canvas id="cv" role="img" aria-label="Static that gathers into an image and slips away"></canvas></div>
    <div id="strip" aria-hidden="true"></div>
    <label class="sr" for="f">Dial</label><input type="range" id="f" min="0" max="1000" value="120" aria-label="Radio dial">
    <div class="row"><div class="meter" aria-hidden="true"><b id="meter"></b></div><span id="say" aria-live="polite">Noise.</span></div>
    <p class="note">The dial never stops on a station. Hold it where the picture is clearest and it drifts away. In 1977 a radio telescope called Big Ear recorded a strong narrow signal for 72 seconds and an astronomer wrote "Wow!" beside it; it was never heard again. The same year two probes left Earth with a gold disc and a needle, for whoever might have one.</p>
    <figcaption>FIG. 8. Between stations. Images are NASA public domain: the Voyager Golden Record, "Pale Blue Dot" (Voyager 1, 1990), and the FAST radio telescope. The static is generated in code. The record's own audio has mixed rights, so it is evoked, never reused. The Wow! signal: Big Ear, Ohio State University, 15 August 1977 (details to be checked against the Big Ear printout before publication). <a href="credits.html">Credits</a>.</figcaption>
  </figure>
</main>
