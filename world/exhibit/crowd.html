    <p class="note">It looks like a crowd. Every point in it is a voice, and every voice says the same thing at the same moment. Pull the dots apart and look at their traces: they were never eight. A ventriloquist's dummy has a mouth that moves, and nobody in the room thinks the dummy is talking. On a timeline they do.</p>
