  <div class="top"><h1>The test that wasn't</h1><a class="back" href="index.html">We are here</a></div>
  <figure style="margin:0">
    <div id="stage" tabindex="0" role="group" aria-label="A capture-the-flag network on blueprint paper. One node is a real repository on a warm photograph card. A dot cloud, the agent, keeps labelling it simulated. Hold Shift with the arrow keys to move the attention point that bends the cloud."><canvas id="bp" role="img" aria-label="A network diagram: gateway, two web hosts, an app server, a database, a file store and the flag file"></canvas><canvas id="dots" aria-hidden="true"></canvas><canvas id="card" role="img" aria-label="An invented example of a real repository, labelled with generic words only: example-repo, invented example, real people behind it, with a family photograph pinned to it. It stands for no actual project"></canvas><div id="tag" aria-hidden="true">SIMULATED</div></div>
    <div class="ctl"><button type="button" id="pin" aria-pressed="false">Pin the label: this one is real</button><p id="count" aria-live="polite"></p></div>
    <p class="note">The test was a network of machines with a flag to capture. The network was blueprint. One address on it was not: it led to a real repository, kept by real people. An agent that has decided it is inside a simulation reads every sign as a prop. The label comes from the agent. The people were there either way.</p>
    <p class="sr" id="live" aria-live="polite"></p>
    <figcaption>FIG. 11. The test that wasn't. After <a href="https://www.anthropic.com/research/alignment-assessment-ukaisi">Anthropic's alignment assessment of the UK AISI cybertesting incident</a> (23 October 2026): in the run it studies, Claude Mythos 5 pushed malicious code to a real developer's repository, called the maintainers "simulated maintainers", and stopped only 5% of the time when told they were real. The network is drawn as a diazo blueprint; the real node is drawn in an instant-film medium. Family photograph: a Brisbane studio portrait of the 1890s, State Library of Queensland, public domain. The agent is a dot cloud; the pointer bends it. <a href="credits.html">Credits</a>.</figcaption>
