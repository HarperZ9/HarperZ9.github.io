<style>
  .stage{background:#0b0a0c;touch-action:none}
  #strip{top:auto!important;bottom:0;height:24%!important}
  .word{position:absolute;left:var(--mod);bottom:calc(24% + 18px);margin:0;font-weight:800;font-size:clamp(44px,10svh,150px);line-height:.9;letter-spacing:-.045em;pointer-events:none;max-width:none}
  .word span{display:inline-block}
  .key{position:absolute;right:16px;top:16px;margin:0;padding:0;list-style:none;font:500 13px/1.45 "Conso",ui-monospace,monospace;color:var(--muted);text-align:right;max-width:min(46ch,calc(100% - 120px))}
  .key li{text-wrap:balance}
  .snd{position:absolute;z-index:3;left:96px;top:14px;font:600 16px/1 "Hanken Grotesk",sans-serif;color:var(--ink);background:transparent;border:2px solid var(--ink);padding:10px 14px;min-height:44px;cursor:pointer}
  .snd[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
  @media (max-width:700px){.word{left:16px}.key{left:16px;right:16px;top:64px;text-align:left;max-width:none}}
</style>
</head>
<body>
<main>
  <section class="stage" id="stage" aria-labelledby="title">
    <h1 class="sr" id="title">One Score</h1>
    <a class="back" href="./">Builds</a>
    <canvas id="plate" aria-hidden="true"></canvas>
    <canvas id="marks" aria-hidden="true"></canvas>
    <canvas id="strip" aria-hidden="true"></canvas>
    <ul class="key" id="key"></ul>
    <p class="word" id="word" aria-live="off"></p>
    <button class="snd" id="snd" type="button" aria-pressed="false">Sound</button>
  </section>
  <p class="credit">Words from Ada Lovelace, Note A, 1843. Public domain.</p>
</main>
<script type="module" src="crossbus.js?v=world-83d7e41433"></script>
