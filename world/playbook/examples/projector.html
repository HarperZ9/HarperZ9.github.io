<style>
  .stage{background:#141412}
  .labels{position:absolute;inset:0;pointer-events:none}
  .labels span{position:absolute;left:0;top:0;white-space:nowrap;font-family:"Conso",ui-monospace,monospace;font-size:13px;line-height:1;letter-spacing:.06em;color:var(--ink);will-change:transform}
  .labels span.hot{color:#ff4fa3}
  .title{position:absolute;left:16px;bottom:88px;z-index:2}
  .line{position:absolute;left:16px;bottom:22px;z-index:2;margin:0;font-size:17px;line-height:1.45;max-width:min(52ch,calc(100vw - 32px));color:var(--ink);min-height:2.9em;display:flex;align-items:flex-end}

  .steps button{font:500 13px/1 "Conso",ui-monospace,monospace;letter-spacing:.04em;color:var(--muted);background:transparent;border:0;border-bottom:2px solid var(--line);min-width:44px;min-height:44px;cursor:pointer;padding:0 6px}
  .steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--hot)}
  .steps button:hover{color:var(--ink)}
  @media (max-width:600px){.steps{left:16px;right:auto;top:auto;bottom:14px}.title{bottom:150px}.line{bottom:72px}}
</style>
