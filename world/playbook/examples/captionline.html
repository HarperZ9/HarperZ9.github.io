<style>
  .stage{background:#0d1a22}
  .cl{position:absolute;pointer-events:none;color:var(--ink)}
  .cl span,.cl mark{display:inline-block;will-change:opacity,transform}
  .cl-kinetic{left:var(--mod);right:var(--mod);top:44%;text-align:center}
  .cl-kinetic p{margin:0 auto;max-width:none;font-weight:800;font-size:clamp(36px,8.5svh,124px);line-height:.98;letter-spacing:-.04em}
  .cl-quote{left:var(--mod);right:var(--mod);top:21%}
  .cl-quote blockquote{margin:0}
  .cl-quote p{margin:0;max-width:none;font-weight:700;font-size:clamp(22px,4.5svh,54px);line-height:1.22;letter-spacing:-.02em;max-width:24ch}
  .cl-quote mark{background:transparent;color:inherit;padding:0 .15em;margin:0 -.15em}
  .cl-quote mark.on{background:var(--hot);color:var(--ground)}
  .cl-quote cite{display:block;margin-top:1.1em;font:500 clamp(13px,2svh,22px)/1.4 "Conso",ui-monospace,monospace;font-style:normal;color:var(--muted);letter-spacing:.01em}
  .cl-log{left:var(--mod);right:var(--mod);bottom:calc(var(--mod) * .7)}
  .cl-log ol{margin:0;padding:0;list-style:none;font:500 clamp(15px,2.8svh,32px)/1.5 "Conso",ui-monospace,monospace}
  .cl-log li{padding-left:2.4em}.cl-log li::before{content:counter(list-item,decimal-leading-zero);color:var(--muted);display:inline-block;width:2.4em;margin-left:-2.4em}
  .cl-log .cl-cur::after{content:"";display:inline-block;width:.55em;height:.95em;margin-left:.3em;vertical-align:-.12em;background:var(--hot)}
  @media (max-width:700px){.cl-quote{top:16%;left:16px;right:16px}.cl-log{left:16px;right:16px}.cl-kinetic{left:16px;right:16px}}
</style>
</head>

<main>
  <section class="stage" id="stage" aria-labelledby="title">
    <h1 class="sr" id="title">Order</h1>
    <a class="back" href="./">Builds</a>
    <canvas id="plate" aria-hidden="true"></canvas>
    <div id="caps" aria-hidden="true"></div>
    <div class="sr" id="transcript"></div>
  </section>
  <p class="credit">Ada Lovelace, Notes A and G to her translation of L. F. Menabrea, <i>Sketch of the Analytical Engine</i>, 1843. Public domain.</p>
