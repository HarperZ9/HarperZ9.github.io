<body>
<main id="vis">
  <canvas id="art" aria-hidden="true"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>

  <header class="corner tl">
    <h1><label for="source" class="vh">Source</label>
      <select id="source">
        <option value="hum">Hum v3</option>
        <option value="sax">alto saxophone solo</option>
        <option value="satie">Gymnopédie No. 3</option>
        <option value="cpi">Prices, 1914 to 2024</option>
        <option value="file">a file of yours</option>
      </select></h1>
    <p class="credit" id="credit"></p>
  </header>

  <section class="corner tr" aria-label="Measured now">
    <p class="value" id="v0"></p>
    <p id="v1"></p>
    <p id="v2"></p>
  </section>

  <section class="corner bl about" id="about" aria-label="Definition">
    <p class="term" id="term"></p>
    <p class="def" id="def"></p>
    <p class="src" id="defsrc"></p>
  </section>

  <section class="corner br" aria-label="Spectrum and drive">
    <p id="readout"></p>
    <div class="bands" id="bands" role="group" aria-label="How strongly each band drives the picture"></div>
    <a id="settings" download="settings.json" href="#">settings.json</a>
  </section>

  <button id="info" type="button" aria-expanded="false" aria-controls="about" aria-label="About this view">i</button>
  <button id="play" type="button" aria-pressed="false"><span class="vh" id="playLabel">Play</span></button>
  <label for="seek" class="vh">Position</label>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1">
  <input type="file" id="file" accept="audio/*" class="vh" tabindex="-1">
  <p class="vh" id="status" role="status"></p>
</main>
<script type="module" src="app.js?v=world-99f03a9984"></script>
</body>
</html>
