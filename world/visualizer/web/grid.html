<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../typeface/dist/variable/AccessionMono[wght].woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../typeface/dist/variable/AccessionText[INKS,wght].woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../typeface/dist/accession.css?v=world-99f03a9984">

<link rel="stylesheet" href="grid.css?v=world-99f03a9984">
</head>
<body>
<main id="vis">
  <canvas id="art" aria-hidden="true"></canvas>

  <header class="corner tl">
    <h1><label for="source" class="vh">Score</label>
      <select id="source">
        <option value="humGrid">Hum v3, the score</option>
        <option value="file">a MIDI file of yours</option>
      </select></h1>
    <p class="credit" id="credit"></p>
  </header>

  <section class="corner tr" aria-label="Measured now">
    <p class="value" id="v0"></p>
    <p id="v1"></p>
    <p id="v2"></p>
  </section>

  <section class="corner bl about" id="about" aria-label="Definition">
    <p class="term">Decay</p>
    <p class="def">A struck cell empties from its centre: the ink fades as the ground grows, on one ease-out curve.</p>
    <p class="src" id="fadeline"></p>
  </section>

  <section class="corner br" aria-label="Mapping">
    <p class="def about" id="mapping"></p>
    <a id="settings" download="settings.json" href="#">settings.json</a>
  </section>

  <button id="info" type="button" aria-expanded="false" aria-controls="about mapping" aria-label="About this view">i</button>
  <button id="play" type="button" aria-pressed="false"><span class="vh" id="playLabel">Play</span></button>
  <label for="seek" class="vh">Position</label>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1">
  <input type="file" id="file" accept=".mid,.midi,audio/midi" class="vh" tabindex="-1">
  <table class="vh" id="cells"><caption>Which keys strike which cell</caption><thead><tr><th scope="col">Cell</th><th scope="col">Keys</th></tr></thead><tbody></tbody></table>
  <p class="vh" id="status" role="status"></p>
</main>
<script type="module" src="grid.js?v=world-99f03a9984"></script>
</body>
</html>
