<!doctype html>
<meta charset="utf-8"><title>wave2 temporal self-test</title>
<body style="background:#111;color:#ddd;font:13px ui-monospace,monospace">
<pre id="log">running…</pre>
<div id="strip"></div>
<script type="module">
import { OPS2, OP_META2 } from "./glitch-ops-wave2-temporal.js";

const out = [];
const say = (s) => { out.push(s); document.getElementById("log").textContent = out.join("\n"); };
const results = [];

function testPic(w, h, flat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  if (flat) { g.fillStyle = "#3a6ea5"; g.fillRect(0, 0, w, h); return c; }
  const grad = g.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, "#12203a"); grad.addColorStop(1, "#c8a14a");
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.fillStyle = "#e9e6df"; g.fillRect(w * 0.12, h * 0.18, w * 0.26, h * 0.5);
  g.fillStyle = "#c02a3a"; g.beginPath(); g.arc(w * 0.68, h * 0.42, Math.min(w, h) * 0.2, 0, 6.283); g.fill();
  g.fillStyle = "#2ad0c0"; for (let i = 0; i < 9; i++) g.fillRect(w * 0.05 + i * w * 0.1, h * 0.8, w * 0.05, h * 0.12);
  g.fillStyle = "#fff"; g.font = "700 " + Math.round(h * 0.16) + "px monospace"; g.fillText("TX", w * 0.42, h * 0.72);
  return c;
}
const px = (c) => c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
function diff(a, b) { let n = 0, s = 0; for (let i = 0; i < a.length; i += 4) { const d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]); if (d > 6) n++; s += d; } return { frac: n / (a.length / 4), mean: s / (a.length / 4) }; }
// crude legibility check: correlation of luma between source and result
function corr(a, b) {
  let n = a.length / 4, sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
  for (let i = 0; i < a.length; i += 4) {
    const x = a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114;
    const y = b[i] * 0.299 + b[i + 1] * 0.587 + b[i + 2] * 0.114;
    sa += x; sb += y; saa += x * x; sbb += y * y; sab += x * y;
  }
  const cov = sab / n - (sa / n) * (sb / n);
  const va = saa / n - (sa / n) ** 2, vb = sbb / n - (sb / n) ** 2;
  return va <= 0 || vb <= 0 ? 0 : cov / Math.sqrt(va * vb);
}

const W = 240, H = 180;
const names = Object.keys(OPS2);
say("ops: " + names.join(", "));
if (names.length !== 6 || OP_META2.length !== 6) say("FAIL: expected 6 ops + 6 meta");
for (const m of OP_META2) if (!OPS2[m.op]) say("FAIL: meta " + m.op + " has no fn");

for (const name of names) {
  const fn = OPS2[name];
  let line = name.padEnd(15);
  // amount 0 must be a no-op
  const base = testPic(W, H), a0 = testPic(W, H);
  try { fn(a0, { amount: 0, seed: "s", phase: 0 }); } catch (e) { line += " THROW@0 " + e.message; say(line); continue; }
  const d0 = diff(px(base), px(a0));
  line += " noop@0=" + (d0.frac < 0.0005 ? "yes" : "NO(" + d0.frac.toFixed(4) + ")");

  // amount 1 must be strong but still correlated with the source
  const a1 = testPic(W, H);
  const t0 = performance.now();
  try { fn(a1, { amount: 1, seed: "s", phase: 1.7 }); } catch (e) { line += " THROW@1 " + e.message; say(line); continue; }
  const ms = performance.now() - t0;
  const d1 = diff(px(base), px(a1));
  const c1 = corr(px(base), px(a1));
  line += " changed@1=" + (d1.frac * 100).toFixed(1) + "% corr=" + c1.toFixed(2) + " " + ms.toFixed(1) + "ms";

  // determinism: same seed twice = identical bytes
  const r1 = testPic(W, H), r2 = testPic(W, H);
  fn(r1, { amount: 0.7, seed: "abc", phase: 0.4 }); fn(r2, { amount: 0.7, seed: "abc", phase: 0.4 });
  const same = diff(px(r1), px(r2)).frac === 0;
  // different seed = different result
  const r3 = testPic(W, H); fn(r3, { amount: 0.7, seed: "xyz", phase: 0.4 });
  const seedMatters = diff(px(r1), px(r3)).frac > 0.0005;
  line += " det=" + (same ? "yes" : "NO") + " seedvaries=" + (seedMatters ? "yes" : "no");

  // degenerate input
  let deg = "ok";
  try {
    const tiny = testPic(1, 1); fn(tiny, { amount: 1, seed: "s" });
    const zero = document.createElement("canvas"); zero.width = 0; zero.height = 0; fn(zero, { amount: 1, seed: "s" });
    const thin = testPic(2, 2); fn(thin, { amount: 1, seed: "s" });
    const flat = testPic(W, H, true); fn(flat, { amount: 1, seed: "s" });
    fn(testPic(W, H), {});                     // no params at all
    fn(testPic(W, H), { amount: 5, seed: null, phase: -3 });
  } catch (e) { deg = "THROW " + e.message; }
  line += " degenerate=" + deg;
  say(line);

  // visual strip
  const shot = testPic(W, H); fn(shot, { amount: 0.85, seed: "s", phase: 0.6 });
  shot.style.cssText = "width:200px;margin:2px;border:1px solid #333";
  shot.title = name;
  document.getElementById("strip").appendChild(shot);
  results.push(name);
}
// stacking: all six in sequence must survive
try {
  const stack = testPic(W, H);
  for (const m of OP_META2) OPS2[m.op](stack, { amount: 0.6, seed: "stack", phase: 0.3 });
  const c = corr(px(testPic(W, H)), px(stack));
  say("stack all six: ok, corr=" + c.toFixed(2));
  stack.style.cssText = "width:200px;margin:2px;border:1px solid #c02a3a";
  document.getElementById("strip").appendChild(stack);
} catch (e) { say("stack THROW " + e.message); }
say("DONE " + results.length + "/6");
</script>
