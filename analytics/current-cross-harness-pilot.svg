<svg role="img" xmlns="http://www.w3.org/2000/svg" class="an-plate" width="1120" height="610" viewBox="0 0 1120 610" aria-labelledby="pilot-title pilot-desc"><title id="pilot-title">Cross-harness run across 5 harness roles</title><desc id="pilot-desc">35 attempts · 11 reached a grader · 6 passed · 35/35 receipts verified. On each task the prompt and runtime context every role received were byte-identical. Each square is one attempt: solid when it passed, open when a checker read it and it failed, stippled when no checker could read it. Durations are wall clock on one machine and are not a speed ranking.</desc><style>.an-plate{--p:var(--sheet-paper,#f1ece1);--i:var(--sheet-ink,#16130f);--s:var(--sheet-soft,#4a443b);--h:var(--sheet-hair,#d6ccb8);--f:var(--sheet-frame,#b9af9b)}@media (prefers-color-scheme:dark){.an-plate{--p:var(--sheet-paper,#0a0a0d);--i:var(--sheet-ink,#ece5d6);--s:var(--sheet-soft,#b8b0a0);--h:var(--sheet-hair,#262529);--f:var(--sheet-frame,#38363b)}}@media (forced-colors:active){.an-plate{forced-color-adjust:none;--p:Canvas;--i:CanvasText;--s:CanvasText;--h:GrayText;--f:CanvasText}}@media print{.an-plate{--p:#ffffff;--i:#000000;--s:#333333;--h:#aaaaaa;--f:#999999}}.an-plate text{font-family:"Hanken Grotesk",system-ui,sans-serif;fill:var(--i);paint-order:stroke;stroke:var(--p);stroke-width:3px;stroke-linejoin:round}.an-plate .s{fill:var(--s)}.an-plate .bg{fill:var(--p);stroke:var(--f)}.an-plate .g{stroke:var(--h);stroke-dasharray:2 4}.an-plate .h{stroke:var(--h)}.an-plate .z{stroke:var(--i);stroke-width:1.4}.an-plate .bar{fill:url(#an-scan);stroke:var(--i)}.an-plate .scan{fill:var(--i)}.an-plate .open{fill:var(--p);stroke:var(--i);stroke-width:1.4}.an-plate .fill{fill:var(--i)}.an-plate .unk{fill:url(#an-stip);stroke:var(--s);stroke-width:1.2;stroke-dasharray:3 2}.an-plate .dot{fill:var(--s)}.an-plate .focus-ring{fill:none;stroke:none}.an-plate g:focus{outline:none}.an-plate g:focus-visible .focus-ring{stroke:var(--i);stroke-width:2}</style><defs><pattern id="an-stip" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".85" class="dot"/></pattern></defs><rect x="0.5" y="0.5" width="1119" height="609" class="bg"/><text x="42" y="48" font-size="27" font-weight="760">Cross-harness run across 5 harness roles</text><text x="42" y="78" class="s" font-size="16" font-weight="500">35 attempts · 11 reached a grader · 6 passed · 35/35 receipts verified</text><text x="42" y="102" class="s" font-size="14">byte-identical prompt and runtime context for every role on each of 7 tasks · durations are wall clock on one machine</text><g><rect x="42.5" y="119.5" width="15" height="15" class="fill"/><text x="66" y="132" class="s" font-size="14">passed</text><rect x="152.5" y="119.5" width="15" height="15" class="open"/><text x="176" y="132" class="s" font-size="14">reached a grader and failed</text><rect x="392.5" y="119.5" width="15" height="15" class="unk"/><text x="416" y="132" class="s" font-size="14">never reached a grader</text></g><g role="graphics-symbol" tabindex="0" aria-label="Claude Code: 2 of 7 readable, 1 passed, median 49.1 s · Claude Sonnet 5"><rect class="focus-ring" x="38" y="142" width="1044" height="58"/><text x="56" y="172" font-size="19" font-weight="700">Claude Code</text><text x="56" y="194" class="s" font-size="14">median 49.1 s · Claude Sonnet 5</text><rect x="330.5" y="153.5" width="25" height="25" class="fill"/><rect x="364.5" y="153.5" width="25" height="25" class="open"/><rect x="398.5" y="153.5" width="25" height="25" class="unk"/><rect x="432.5" y="153.5" width="25" height="25" class="unk"/><rect x="466.5" y="153.5" width="25" height="25" class="unk"/><rect x="500.5" y="153.5" width="25" height="25" class="unk"/><rect x="534.5" y="153.5" width="25" height="25" class="unk"/><text x="592" y="173" font-size="16" font-weight="600">2 of 7 reached a grader</text><text x="592" y="194" class="s" font-size="14">1 passed</text></g>
