<svg role="img" xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" aria-labelledby="record-title record-desc"><title id="record-title">Flywheel offline benchmark record</title><desc id="record-desc">6 suites ran with no model endpoint. 5 report a measured rate and 1 reports a signed difference drawn as a null rather than as a rate. The 33 row capability matrix beneath is a dated reading of public documentation, not a measurement of any peer harness.</desc><style>text{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eef6f6}.mono{font-family:"Conso","JetBrains Mono",ui-monospace,monospace}.muted{fill:#bcd0d4}g:focus{outline:none}g:focus-visible .focus-ring{stroke:#ffffff;stroke-width:4}</style><rect width="1120" height="560" fill="#070c0f"></rect><text x="42" y="44" font-size="25" font-weight="700">Flywheel offline benchmark record</text><text x="42" y="76" class="mono muted" font-size="15">6 suites, no model endpoint required &#183; 5 measured rates &#183; 1 negative result</text><text x="42" y="102" class="mono muted" font-size="13">Every number is read out of the sealed record. The negative result is drawn as a null, never on a pass-rate track.</text><g role="graphics-symbol" tabindex="0" aria-label="accountability, 100% harness overall over 8 dimensions"><rect class="focus-ring" x="34" y="128" width="1052" height="52" rx="8" fill="none" stroke="none"></rect><text x="52" y="158" font-size="17" font-weight="700">accountability</text><text x="52" y="178" class="mono muted" font-size="12">8 dimensions</text><rect x="452" y="144" width="470" height="16" rx="4" fill="#0d1519" stroke="#33484e"></rect><rect x="452" y="144" width="470" height="16" rx="4" fill="#2c4a52" stroke="#9fc2c7"></rect><text x="946" y="158" font-size="16">100%</text></g><g role="graphics-symbol" tabindex="0" aria-label="governed-agent, 100% pass rate over 6 scenarios"><rect class="focus-ring" x="34" y="190" width="1052" height="52" rx="8" fill="none" stroke="none"></rect><text x="52" y="220" font-size="17" font-weight="700">governed-agent</text><text x="52" y="240" class="mono muted" font-size="12">6 scenarios</text><rect x="452" y="206" width="470" height="16" rx="4" fill="#0d1519" stroke="#33484e"></rect><rect x="452" y="206" width="470" height="16" rx="4" fill="#2c4a52" stroke="#9fc2c7"></rect><text x="946" y="220" font-size="16">100%</text></g><g role="graphics-symbol" tabindex="0" aria-label="agent-recovery, 100% recovery success rate over 6 scenarios"><rect class="focus-ring" x="34" y="252" width="1052" height="52" rx="8" fill="none" stroke="none"></rect><text x="52" y="282" font-size="17" font-weight="700">agent-recovery</text><text x="52" y="302" class="mono muted" font-size="12">6 scenarios</text><rect x="452" y="268" width="470" height="16" rx="4" fill="#0d1519" stroke="#33484e"></rect><rect x="452" y="268" width="470" height="16" rx="4" fill="#2c4a52" stroke="#9fc2c7"></rect><text x="946" y="282" font-size="16">100%</text></g><g role="graphics-symbol" tabindex="0" aria-label="stateful-provider-swap, 100% pass rate over 10 checks"><rect class="focus-ring" x="34" y="314" width="1052" height="52" rx="8" fill="none" stroke="none"></rect><text x="52" y="344" font-size="17" font-weight="700">stateful-provider-swap</text><text x="52" y="364" class="mono muted" font-size="12">10 checks</text><rect x="452" y="330" width="470" height="16" rx="4" fill="#0d1519" stroke="#33484e"></rect><rect x="452" y="330" width="470" height="16" rx="4" fill="#2c4a52" stroke="#9fc2c7"></rect><text x="946" y="344" font-size="16">100%</text></g><g role="graphics-symbol" tabindex="0" aria-label="source-mined, 100% pass rate over 26 cases"><rect class="focus-ring" x="34" y="376" width="1052" height="52" rx="8" fill="none" stroke="none"></rect><text x="52" y="406" font-size="17" font-weight="700">source-mined</text><text x="52" y="426" class="mono muted" font-size="12">26 cases</text><rect x="452" y="392" width="470" height="16" rx="4" fill="#0d1519" stroke="#33484e"></rect><rect x="452" y="392" width="470" height="16" rx="4" fill="#2c4a52" stroke="#9fc2c7"></rect><text x="946" y="406" font-size="16">100%</text></g><g role="graphics-symbol" tabindex="0" aria-label="paired-replication, -3.05 pp, a signed difference, not a rate, over 164 tasks"><rect class="focus-ring" x="34" y="438" width="1052" height="52" rx="8" fill="none" stroke="none"></rect><text x="52" y="468" font-size="17" font-weight="700">paired-replication</text><text x="52" y="488" class="mono muted" font-size="12">164 tasks</text><rect x="452" y="454" width="470" height="16" rx="4" fill="#0d1519" stroke="#f3c58f" stroke-dasharray="5 4"></rect><text x="946" y="468" font-size="16" fill="#f3c58f">-3.05 pp</text></g><line x1="42" y1="490" x2="1078" y2="490" stroke="#33484e"></line><text x="42" y="518" class="mono muted" font-size="13">33 capability rows &#183; the Flywheel column is checked against the repository at read time &#183; peer columns are dated declarations</text><text x="42" y="536" class="mono muted" font-size="13">2026-09-03 &#183; no peer harness was executed &#183; not a speed, quality, or market ranking</text></svg>
