<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raw-native verified viewer</title>
<style>
:root { --ink: #16181d; --ground: #f6f5f1; --muted: #5d6270; --rule: #d9d7cf; --verified: #1f7a4d; --refuted: #a8362a; --unverifiable: #6b6f78; }
@media (prefers-color-scheme: dark) { :root { --ink: #e9e7e1; --ground: #121418; --muted: #9aa0ab; --rule: #2a2e36; --verified: #5cc18f; --refuted: #e07a6c; --unverifiable: #9aa0ab; } }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; }
.lede { color: var(--muted); margin: 0 0 20px; max-width: 68ch; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
button, select, input[type=file] { font: inherit; color: inherit; }
button, select { background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
input[type=file]::file-selector-button { font: inherit; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 10px; }
.frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 20px 0; }
figure { margin: 0; }
canvas { width: 100%; image-rendering: pixelated; background: var(--rule); display: block; }
figcaption, .mono, pre, td, th { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12.5px; }
figcaption { color: var(--muted); margin-top: 6px; }
.verdict { font-size: 20px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; }
.verdict.verified { color: var(--verified); } .verdict.refuted { color: var(--refuted); } .verdict.unverifiable { color: var(--unverifiable); }
table { border-collapse: collapse; margin: 8px 0; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 2px 16px 2px 0; }
td { padding: 2px 0; }
pre { white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; }
#status { color: var(--muted); }
</style>
<main>
  <h1>Verified viewer</h1>
  <p class="lede">Open a glTF file. raw-native renders it on your GPU through WebGPU and on the CPU
    reference, then shows both frames, the error map between them and the certificate that
    states whether they agree within the committed tolerance.</p>
  <div class="controls">
    <label>glTF or GLB file <input id="open" type="file" accept=".gltf,.glb,.bin,.png,.jpg,.jpeg,.ktx2" multiple></label>
    <button id="raw-hero" type="button">raw-hero</button>
    <button id="raw-hall" type="button">raw-hall</button>
    <label>Size <select id="size"><option>128</option><option selected>256</option><option>512</option></select></label>
    <label><input id="rt" type="checkbox"> Ray-traced AO reference</label>
    <label>Error scale <select id="scale"><option>1</option><option>10</option><option selected>100</option></select></label>
    <span id="status" class="mono">starting</span>
  </div>
  <div class="frames">
    <figure><canvas id="gpu" width="256" height="256"></canvas><figcaption>GPU frame (WebGPU)</figcaption></figure>
    <figure><canvas id="cpu" width="256" height="256"></canvas><figcaption>CPU reference</figcaption></figure>
    <figure><canvas id="err" width="256" height="256"></canvas><figcaption id="err-caption">Error map</figcaption></figure>
    <figure id="ao-wrap" hidden><canvas id="ao" width="256" height="256"></canvas><figcaption>Ambient occlusion: screen-space against ray-traced, CPU</figcaption></figure>
  </div>
  <section>
    <div id="verdict" class="verdict unverifiable">no render yet</div>
    <p id="claim" class="lede"></p>
    <table id="cert-table"></table>
    <details><summary>Certificate (JSON)</summary><pre id="cert-json"></pre></details>
    <p class="mono" id="version"></p>
  </section>
</main>
<script type="module" src="viewer.mjs"></script>
</html>
