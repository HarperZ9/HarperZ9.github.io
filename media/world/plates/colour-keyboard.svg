<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Seven coloured bars across and seven down, woven; each crossing shows the colour of the two inks printed together."><style>@media (max-width:900px){.p{display:none}.l{font-size:40px}}</style><rect width="1600" height="900" fill="#0d1a24"/><rect x="530" y="160" width="902" height="46.25" rx="23.125" fill="#85d4e6"/><rect x="530" y="240" width="902" height="46.25" rx="23.125" fill="#bae2d0"/><rect x="530" y="320" width="902" height="46.25" rx="23.125" fill="#fdbb4c"/><rect x="530" y="400" width="902" height="46.25" rx="23.125" fill="#f0d680"/><rect x="530" y="480" width="902" height="46.25" rx="23.125" fill="#ec4829"/><rect x="530" y="560" width="902" height="46.25" rx="23.125" fill="#21b245"/><rect x="530" y="640" width="902" height="46.25" rx="23.125" fill="#a37157"/><rect x="560" y="120" width="74" height="606.25" rx="37" fill="#85d4e6"/><rect x="560" y="160" width="74" height="46.25" fill="#36bae0"/><rect x="560" y="240" width="74" height="46.25" fill="#62c5cc"/><rect x="560" y="320" width="74" height="46.25" fill="#9ba555"/><rect x="560" y="400" width="74" height="46.25" fill="#8dbb83"/><rect x="560" y="480" width="74" height="46.25" fill="#984831"/><rect x="560" y="560" width="74" height="46.25" fill="#009f48"/><rect x="560" y="640" width="74" height="46.25" fill="#726758"/><rect x="688" y="120" width="74" height="606.25" rx="37" fill="#bae2d0"/><rect x="688" y="160" width="74" height="46.25" fill="#62c5cc"/><rect x="688" y="240" width="74" height="46.25" fill="#8ed0ba"/><rect x="688" y="320" width="74" height="46.25" fill="#c5ae4a"/><rect x="688" y="400" width="74" height="46.25" fill="#b9c677"/><rect x="688" y="480" width="74" height="46.25" fill="#ba4a29"/><rect x="688" y="560" width="74" height="46.25" fill="#00a641"/><rect x="688" y="640" width="74" height="46.25" fill="#886b51"/><rect x="816" y="120" width="74" height="606.25" rx="37" fill="#fdbb4c"/><rect x="816" y="160" width="74" height="46.25" fill="#9ba555"/><rect x="816" y="240" width="74" height="46.25" fill="#c5ae4a"/><rect x="816" y="320" width="74" height="46.25" fill="#f49600"/><rect x="816" y="400" width="74" height="46.25" fill="#eca81d"/><rect x="816" y="480" width="74" height="46.25" fill="#e23b00"/><rect x="816" y="560" width="74" height="46.25" fill="#4f8d07"/><rect x="816" y="640" width="74" height="46.25" fill="#9f601c"/><rect x="944" y="120" width="74" height="606.25" rx="37" fill="#f0d680"/><rect x="944" y="160" width="74" height="46.25" fill="#8dbb83"/><rect x="944" y="240" width="74" height="46.25" fill="#b9c677"/><rect x="944" y="320" width="74" height="46.25" fill="#eca81d"/><rect x="944" y="400" width="74" height="46.25" fill="#e3be48"/><rect x="944" y="480" width="74" height="46.25" fill="#db4406"/><rect x="944" y="560" width="74" height="46.25" fill="#3e9e25"/><rect x="944" y="640" width="74" height="46.25" fill="#9c6935"/><rect x="1072" y="120" width="74" height="606.25" rx="37" fill="#ec4829"/><rect x="1072" y="160" width="74" height="46.25" fill="#984831"/><rect x="1072" y="240" width="74" height="46.25" fill="#ba4a29"/><rect x="1072" y="320" width="74" height="46.25" fill="#e23b00"/><rect x="1072" y="400" width="74" height="46.25" fill="#db4406"/><rect x="1072" y="480" width="74" height="46.25" fill="#d80000"/><rect x="1072" y="560" width="74" height="46.25" fill="#554203"/><rect x="1072" y="640" width="74" height="46.25" fill="#952b07"/><rect x="1200" y="120" width="74" height="606.25" rx="37" fill="#21b245"/><rect x="1200" y="160" width="74" height="46.25" fill="#009f48"/><rect x="1200" y="240" width="74" height="46.25" fill="#00a641"/><rect x="1200" y="320" width="74" height="46.25" fill="#4f8d07"/><rect x="1200" y="400" width="74" height="46.25" fill="#3e9e25"/><rect x="1200" y="480" width="74" height="46.25" fill="#554203"/><rect x="1200" y="560" width="74" height="46.25" fill="#00880c"/><rect x="1200" y="640" width="74" height="46.25" fill="#3f5b1a"/><rect x="1328" y="120" width="74" height="606.25" rx="37" fill="#a37157"/><rect x="1328" y="160" width="74" height="46.25" fill="#726758"/><rect x="1328" y="240" width="74" height="46.25" fill="#886b51"/><rect x="1328" y="320" width="74" height="46.25" fill="#9f601c"/><rect x="1328" y="400" width="74" height="46.25" fill="#9c6935"/><rect x="1328" y="480" width="74" height="46.25" fill="#952b07"/><rect x="1328" y="560" width="74" height="46.25" fill="#3f5b1a"/><rect x="1328" y="640" width="74" height="46.25" fill="#723f24"/><text x="500" y="192" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" text-anchor="end" class="l">sky</text><text x="500" y="272" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" text-anchor="end" class="l">mist</text><text x="500" y="352" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" text-anchor="end" class="l">sand</text><text x="500" y="432" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" text-anchor="end" class="l">straw</text><text x="500" y="512" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" text-anchor="end" class="l">land</text><text x="500" y="592" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" text-anchor="end" class="l">leaf</text><text x="500" y="672" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" text-anchor="end" class="l">velvet</text><text x="64" y="96" font-size="34" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" font-weight="700">The colour keyboard, woven</text><text x="64" y="800" font-size="21" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p">Seven keys after Le Corbusier: sky and mist recede, sand and straw hold, land and leaf advance, velvet encloses.</text><text x="64" y="832" font-size="21" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" fill="#c9c3b8">Each key mixes the five inks measured on an Olivetti print. Where two bars cross, the colour is what both films</text><text x="64" y="864" font-size="21" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" fill="#c9c3b8">pass together, computed per wavelength by the Clapper-Yule model. The diagonal is a key printed over itself.</text></svg>
