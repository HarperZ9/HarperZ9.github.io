<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Five pairs of overlapping ink discs from an Olivetti print; in each overlap, a band of the measured colour sits between two predicted bands."><style>@media (max-width:900px){.p{display:none}.l{font-size:40px}}</style><rect width="1600" height="900" fill="#0d1a24"/><defs><clipPath id="rc0"><circle cx="128" cy="380" r="108"/></clipPath><clipPath id="rc0b"><circle cx="192" cy="380" r="108"/></clipPath></defs><circle cx="128" cy="380" r="108" fill="#04b2dd"/><circle cx="192" cy="380" r="108" fill="#fcc603"/><g clip-path="url(#rc0)"><rect x="84" y="272" width="216" height="66.96" fill="#048e03" clip-path="url(#rc0b)"/></g><g clip-path="url(#rc0)"><rect x="84" y="338.96" width="216" height="82.08" fill="#028e3f" clip-path="url(#rc0b)"/></g><g clip-path="url(#rc0)"><rect x="84" y="421.04" width="216" height="66.96" fill="#559338" clip-path="url(#rc0b)"/></g><text x="160" y="560" font-size="26" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" font-weight="700" text-anchor="middle" class="l">cyan over yellow</text><text x="160" y="610" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">multiply, above: off by 6.71</text><text x="160" y="640" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">Clapper-Yule, below: off by 7.75</text><defs><clipPath id="rc1"><circle cx="448" cy="380" r="108"/></clipPath><clipPath id="rc1b"><circle cx="512" cy="380" r="108"/></clipPath></defs><circle cx="448" cy="380" r="108" fill="#eb4324"/><circle cx="512" cy="380" r="108" fill="#fcc603"/><g clip-path="url(#rc1)"><rect x="404" y="272" width="216" height="66.96" fill="#eb3400" clip-path="url(#rc1b)"/></g><g clip-path="url(#rc1)"><rect x="404" y="338.96" width="216" height="82.08" fill="#c03314" clip-path="url(#rc1b)"/></g><g clip-path="url(#rc1)"><rect x="404" y="421.04" width="216" height="66.96" fill="#de3c00" clip-path="url(#rc1b)"/></g><text x="480" y="560" font-size="26" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" font-weight="700" text-anchor="middle" class="l">red over yellow</text><text x="480" y="610" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">multiply, above: off by 9.2</text><text x="480" y="640" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">Clapper-Yule, below: off by 7.64</text><defs><clipPath id="rc2"><circle cx="768" cy="380" r="108"/></clipPath><clipPath id="rc2b"><circle cx="832" cy="380" r="108"/></clipPath></defs><circle cx="768" cy="380" r="108" fill="#07ac3d"/><circle cx="832" cy="380" r="108" fill="#04b2dd"/><g clip-path="url(#rc2)"><rect x="724" y="272" width="216" height="66.96" fill="#007b39" clip-path="url(#rc2b)"/></g><g clip-path="url(#rc2)"><rect x="724" y="338.96" width="216" height="82.08" fill="#029642" clip-path="url(#rc2b)"/></g><g clip-path="url(#rc2)"><rect x="724" y="421.04" width="216" height="66.96" fill="#008742" clip-path="url(#rc2b)"/></g><text x="800" y="560" font-size="26" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" font-weight="700" text-anchor="middle" class="l">green over cyan</text><text x="800" y="610" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">multiply, above: off by 9.8</text><text x="800" y="640" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">Clapper-Yule, below: off by 5.59</text><defs><clipPath id="rc3"><circle cx="1088" cy="380" r="108"/></clipPath><clipPath id="rc3b"><circle cx="1152" cy="380" r="108"/></clipPath></defs><circle cx="1088" cy="380" r="108" fill="#eb4324"/><circle cx="1152" cy="380" r="108" fill="#1a1b22"/><g clip-path="url(#rc3)"><rect x="1044" y="272" width="216" height="66.96" fill="#170201" clip-path="url(#rc3b)"/></g><g clip-path="url(#rc3)"><rect x="1044" y="338.96" width="216" height="82.08" fill="#482a26" clip-path="url(#rc3b)"/></g><g clip-path="url(#rc3)"><rect x="1044" y="421.04" width="216" height="66.96" fill="#1a0604" clip-path="url(#rc3b)"/></g><text x="1120" y="560" font-size="26" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" font-weight="700" text-anchor="middle" class="l">red over black</text><text x="1120" y="610" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">multiply, above: off by 13.62</text><text x="1120" y="640" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">Clapper-Yule, below: off by 12.78</text><defs><clipPath id="rc4"><circle cx="1408" cy="380" r="108"/></clipPath><clipPath id="rc4b"><circle cx="1472" cy="380" r="108"/></clipPath></defs><circle cx="1408" cy="380" r="108" fill="#07ac3d"/><circle cx="1472" cy="380" r="108" fill="#eb4324"/><g clip-path="url(#rc4)"><rect x="1364" y="272" width="216" height="66.96" fill="#062c03" clip-path="url(#rc4b)"/></g><g clip-path="url(#rc4)"><rect x="1364" y="338.96" width="216" height="82.08" fill="#261b28" clip-path="url(#rc4b)"/></g><g clip-path="url(#rc4)"><rect x="1364" y="421.04" width="216" height="66.96" fill="#4d3d00" clip-path="url(#rc4b)"/></g><text x="1440" y="560" font-size="26" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" font-weight="700" text-anchor="middle" class="l">green over red</text><text x="1440" y="610" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">multiply, above: off by 36.25</text><text x="1440" y="640" font-size="19" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" text-anchor="middle">Clapper-Yule, below: off by 31.87</text><text x="64" y="96" font-size="34" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" font-weight="700">Where two inks cross: measured on the print, and predicted</text><text x="64" y="136" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p">Each lens: per-channel multiply above, the print's own colour in the middle, Clapper-Yule below.</text><text x="64" y="760" font-size="24" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p">Median CIEDE2000 against the print: multiply 9.8, Beer-Lambert 9.32, Clapper-Yule 7.75.</text><text x="64" y="798" font-size="22" fill="#f4efe6" font-family="'Hanken Grotesk',system-ui,sans-serif" class="p" fill-opacity=".86">Misses in CIEDE2000. Five overlaps; every model is fitted on single inks only. Green over red stays the worst.</text></svg>
