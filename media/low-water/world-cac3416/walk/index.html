<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low Water: the island</title>
<style>
  @font-face { font-family: "Hanken"; src: url("/fonts/hanken-grotesk.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Conso"; src: url("/fonts/conso-regular.woff2") format("woff2"); font-display: swap; }
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  /* the plate: a paper label with a hairline, set low and left so the picture keeps the frame */
  #hud { position: fixed; left: 20px; bottom: 18px; color: #1d1a16; background: rgba(233, 226, 208, 0.88); border: 1px solid #1d1a16; padding: 8px 12px 7px; max-width: min(560px, 80vw); font-family: "Hanken", system-ui, sans-serif; }
  #hud .place { font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
  #hud .air { font-size: 13px; font-style: italic; margin-top: 1px; }
  #hud .where { font-family: "Conso", ui-monospace, monospace; font-size: 11px; margin-top: 5px; padding-top: 4px; border-top: 1px solid rgba(29, 26, 22, 0.5); white-space: pre; }
  #hud .keys { font-size: 11px; margin-top: 4px; color: #4a4338; }
  #note { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); color: #e9e2d0; font: 15px "Hanken", system-ui, sans-serif; letter-spacing: 0.08em; text-align: center; max-width: 70vw; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #hud { transition: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="A view of the island of Low Water. Use W A S D to move and the mouse to look."></canvas>
<div id="hud" role="status" aria-live="off">
  <div class="place"></div>
  <div class="air"></div>
  <div class="where"></div>
  <div class="keys">W A S D move. Click, then the mouse looks. Shift runs. F flies. Space and C rise and sink. 1 to 9, 0 and the minus key go to a region. The wheel turns the clock. T holds it. H hides this plate.</div>
</div>
<div id="note" role="alert">Starting</div>
<script type="module" src="./walk.mjs"></script>
</body>
</html>
