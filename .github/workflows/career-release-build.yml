name: Career release verification
on:
  push:
    branches: [work/resume-reconsolidation-20260920]
    paths: ['.career-release/ready']
permissions:
  contents: write
concurrency:
  group: career-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/resume-reconsolidation-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate baseline and unpack reviewed source
        run: |
          test "$(git rev-parse origin/main)" = 2371243aa097aed515c90c9f638ab83fc1475f6a
          python - <<'PY'
          import base64,hashlib,io,lzma,tarfile
          from pathlib import Path
          data=base64.b64decode(''.join(p.read_text().strip() for p in sorted(Path('.career-release').glob('part-*.b64'))),validate=True)
          assert hashlib.sha256(data).hexdigest() == 'bfa7581ba8f451d4382148dd7090d60970e31cc8d88d995f128488c1f99937a6'
          allowed={'changes.patch','career/resume-source.json','career/source-ledger.json','career/source-ledger.md','tools/render_career_pages.py','system/career.css','tests/test_resume_consolidation.py','tests/career-release-browser.cjs'}
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(data)),mode='r:') as archive:
              assert {m.name for m in archive.getmembers()} == allowed
              for member in archive.getmembers():
                  assert member.isfile() and member.size < 1000000
                  target=Path(member.name); target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          PY
          git apply --check changes.patch
          git apply changes.patch
          rm changes.patch
      - name: Install pinned document and test dependencies
        run: |
          python -m pip install pytest==8.4.2 PyYAML==6.0.2 -r requirements-career-docs.txt -r requirements-font-preview.txt
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save playwright@1.62.1
      - name: Generate source-matched career formats and release fingerprint
        run: |
          python tools/render_career_pages.py
          python tools/build_career_artifacts.py --site-root . --output-root career --receipt career/career-build-receipt.json --release-manifest career/career-artifacts.json
          python - <<'PY'
          import runpy,re
          from pathlib import Path
          p=Path('tests/test_capability_publication_release.py')
          fingerprint=runpy.run_path(str(p))['_release_fingerprint']()
          p.write_text(re.sub(r'REVIEWED_RELEASE_SHA256 = "[a-f0-9]+"',f'REVIEWED_RELEASE_SHA256 = "{fingerprint}"',p.read_text()))
          print('Career-scoped release fingerprint:',fingerprint)
          PY
      - name: Python and navigation regression checks
        run: |
          mkdir -p qa
          set -o pipefail
          python -m pytest -q --tb=short | tee qa/pytest.log
          node --test system/nav.test.mjs tests/font-catalog.test.mjs tests/navigation-discovery.mjs tests/pillar-navigation.test.mjs | tee qa/navigation.log
      - name: Real-browser career checks and site link crawl
        run: |
          set -o pipefail
          python -m http.server 8802 >qa/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          SITE_BASE_URL=http://127.0.0.1:8802 BROWSER_CHANNEL=chrome node tests/career-release-browser.cjs | tee qa/career-browser.log
          node tests/linkcheck.mjs | tee qa/links.log
      - name: Render final PDF and Word exports
        run: |
          if ! command -v libreoffice >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice-writer; fi
          mkdir -p qa/docx qa/pdf
          for file in career/Zain-Dana-Harper-Resume-*.docx career/Zain-Dana-Harper-CV.docx; do libreoffice -env:UserInstallation=file:///tmp/career-lo --headless --convert-to pdf --outdir qa/docx "$file"; done
          python - <<'PY'
          import fitz,json
          from pathlib import Path
          results=[]
          for folder,pattern in [('career','Zain-Dana-Harper-Resume-*.pdf'),('career','Zain-Dana-Harper-CV.pdf'),('qa/docx','*.pdf')]:
              for p in sorted(Path(folder).glob(pattern)):
                  doc=fitz.open(p); expected=4 if p.stem.endswith('-CV') else 1
                  assert len(doc)==expected,(str(p),len(doc),expected)
                  for i,page in enumerate(doc):
                      out=Path('qa/pdf')/(('word-' if folder=='qa/docx' else '')+p.stem+f'-{i+1}.png')
                      page.get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(out)
                  results.append({'path':str(p),'pages':len(doc)})
          Path('qa/page-counts.json').write_text(json.dumps(results,indent=2))
          PY
      - name: Commit only reviewed career scope
        run: |
          python - <<'PY'
          import subprocess
          allowed={'cv.html','cv.md','hire.html','resume.html','resume.md','resume-evaluation-tooling.html','resume-grounds.html','resume-public-operations.html','resume-support-operations.html','tools/build_career_artifacts.py','tools/render_career_pages.py','system/career.css','tests/test_career_documents.py','tests/test_career_artifact_generation.py','tests/test_zentropy_sitewide_contract.py','tests/test_capability_publication_release.py','tests/test_resume_consolidation.py','tests/career-release-browser.cjs'}
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()+subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines()
          staged=[]
          for path in paths:
              if path.startswith(('qa/','node_modules/','.career-release/')) or path in {'package-lock.json','package.json'}: continue
              assert path in allowed or path.startswith('career/'), path
              staged.append(path)
          subprocess.run(['git','add','--',*staged],check=True)
          PY
          git config user.name 'Zain Dana Harper'
          git config user.email 'zaindharper@gmail.com'
          git commit -m 'career: restore one-page value-led resumes and expanded source-matched CV'
          git push origin HEAD:work/resume-reconsolidation-20260920
          git rev-parse HEAD > qa/verified-commit.txt
      - name: Upload reviewable exports and verification results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: career-release-review
          path: |
            qa/
            career/
            cv.html
            cv.md
            hire.html
            resume*.html
            resume.md
            tools/render_career_pages.py
            tools/build_career_artifacts.py
            system/career.css
            tests/test_*career*.py
            tests/test_resume_consolidation.py
            tests/test_capability_publication_release.py
            tests/test_zentropy_sitewide_contract.py
            tests/career-release-browser.cjs
          retention-days: 7
