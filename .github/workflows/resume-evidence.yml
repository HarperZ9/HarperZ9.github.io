name: Resume portfolio evidence
on:
  push:
    branches: [work/resume-reconsolidation-20260920]
    paths: [.github/workflows/resume-evidence.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2371243aa097aed515c90c9f638ab83fc1475f6a
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Collect public repository evidence
        run: |
          mkdir -p /tmp/career-evidence
          python - <<'PY'
          import concurrent.futures, hashlib, io, json, pathlib, subprocess, tarfile, urllib.request
          out = pathlib.Path('/tmp/career-evidence')
          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent':'HarperZ9-career-restoration'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()
          repos=[]
          for page in range(1, 5):
              batch=json.loads(get(f'https://api.github.com/users/HarperZ9/repos?per_page=100&page={page}'))
              repos.extend(r for r in batch if not r['fork'])
              if len(batch)<100: break
          index=[{k:r[k] for k in ('name','full_name','description','default_branch','archived','html_url','pushed_at','language')} for r in repos]
          (out/'public-repositories.json').write_text(json.dumps(index,indent=2))
          def read_repo(r):
              folder=out/r['name']; folder.mkdir(exist_ok=True)
              result={'repository':r['full_name'],'branch':r['default_branch'],'files':[]}
              try:
                  head=subprocess.check_output(['git','ls-remote',r['clone_url'],'refs/heads/'+r['default_branch']],text=True,timeout=90).split()[0]
                  result['commit']=head
                  for name in ('README.md','README.rst','README','CHANGELOG.md','pyproject.toml','Cargo.toml'):
                      try:
                          url=f'https://raw.githubusercontent.com/{r["full_name"]}/{head}/{name}'
                          data=get(url)
                          if len(data)>2_000_000: continue
                          (folder/name).write_bytes(data)
                          result['files'].append({'path':name,'url':url,'sha256':hashlib.sha256(data).hexdigest()})
                      except Exception: pass
              except Exception as error: result['error']=str(error)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(read_repo,repos))
          (out/'source-index.json').write_text(json.dumps(results,indent=2))
          core={'flywheel','accountable-surface','articulate','buildlang','emet','gather','index','forum','crucible','relay','phantom'}
          with tarfile.open(out/'core-source.tar.gz','w:gz') as target:
              for record in results:
                  name=record['repository'].split('/')[-1]
                  if name not in core or 'commit' not in record: continue
                  try:
                      data=get(f'https://codeload.github.com/{record["repository"]}/tar.gz/{record["commit"]}')
                      with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as source:
                          for member in source:
                              if not member.isfile() or member.size>2_000_000: continue
                              relative='/'.join(member.name.split('/')[1:])
                              if not relative or relative.startswith(('.git/','.env')): continue
                              if pathlib.Path(relative).suffix.lower() not in {'.md','.rst','.py','.rs','.dart','.toml','.json','.yaml','.yml','.ts','.mjs'}: continue
                              payload=source.extractfile(member).read()
                              info=tarfile.TarInfo(name+'/'+relative); info.size=len(payload)
                              target.addfile(info,io.BytesIO(payload))
                      try:
                          (out/name/'releases.json').write_bytes(get(f'https://api.github.com/repos/{record["repository"]}/releases?per_page=3'))
                      except Exception: pass
                  except Exception as error:
                      (out/(name+'-source-error.txt')).write_text(str(error))
          PY
      - name: Install baseline test dependencies
        run: python -m pip install pytest==8.4.2 PyYAML==6.0.2 -r requirements-career-docs.txt -r requirements-font-preview.txt
      - name: Baseline Python and navigation contracts
        run: |
          set +e
          python -m pytest > /tmp/career-evidence/baseline-pytest.txt 2>&1
          echo "$?" > /tmp/career-evidence/baseline-pytest-exit.txt
          node --test system/nav.test.mjs tests/font-catalog.test.mjs tests/navigation-discovery.mjs tests/pillar-navigation.test.mjs > /tmp/career-evidence/baseline-node.txt 2>&1
          echo "$?" > /tmp/career-evidence/baseline-node-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-portfolio-evidence
          path: /tmp/career-evidence/
          retention-days: 7
