name: Letter live verification
on:
  push:
    branches: [work/checking-machines-20260920]
    paths: [.github/workflows/letter-live-verification.yml]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1830829a8eac83f2c2eee6f27d233b3d2c6b2c86
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser verification dependency
        run: python -m pip install playwright==1.55.0
      - name: Verify deployed bytes and the unchanged website surfaces
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, subprocess, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path.cwd(); out = Path('/tmp/letter-live'); out.mkdir()
          origin = 'https://harperz9.github.io/'
          revision = '1830829a8eac83f2c2eee6f27d233b3d2c6b2c86'
          baseline = '87c320c881392b753c09b3fda305dd9500ca40d6'
          def digest(data): return hashlib.sha256(data).hexdigest()
          def fetch(name):
              req = urllib.request.Request(origin + name, headers={'User-Agent': 'Zentropy-letter-release-verification/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.read()
          expected_page = digest((root/'checking-the-machines.html').read_bytes())
          for attempt in range(18):
              try:
                  status, data = fetch('checking-the-machines.html')
                  if status == 200 and digest(data) == expected_page: break
              except Exception as exc: print(type(exc).__name__, str(exc))
              print('Waiting for the reviewed letter deployment', attempt + 1, flush=True)
              time.sleep(15)
          else: raise RuntimeError('The public page did not match the reviewed commit within the verification window')
          manifest = json.loads((root/'writing/checking-the-machines/build.json').read_text())
          new_paths = [p['path'] for p in manifest['outputs']] + ['writing/checking-the-machines/build.json']
          stable = ['index.html','hire.html','resume.html','cv.html','portfolio.html','writing.html','publications.html','sitemap.xml','system/nav.js','system/routes.js']
          stable += [p.relative_to(root).as_posix() for p in (root/'career').glob('Zain*') if p.suffix in {'.pdf','.docx','.txt','.md'}]
          for name in stable:
              assert (root/name).read_bytes() == subprocess.check_output(['git','show',baseline+':'+name]), name
          def check(name):
              expected = digest((root/name).read_bytes())
              for attempt in range(4):
                  status, data = fetch(name)
                  if status == 200 and digest(data) == expected:
                      return {'path': name, 'http_status': status, 'sha256': expected, 'match': True, 'unchanged_from_prior_release': name in stable}
                  time.sleep(5)
              raise AssertionError(name + ': public bytes differ from reviewed release')
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              checks = list(pool.map(check, new_paths + stable))
          changes = subprocess.check_output(['git','diff','--name-only',baseline,revision],text=True).splitlines()
          allowed = {'checking-the-machines.html','tools/build_checking_machines.py','tests/test_checking_machines_letter.py','tests/test_capability_publication_release.py'}
          assert all(p in allowed or p.startswith('writing/checking-the-machines/') for p in changes), changes
          record = {'verified_at_utc': datetime.now(timezone.utc).isoformat(), 'release_commit': revision, 'baseline_commit': baseline, 'all_hashes_match': True, 'publication_paths_checked': len(new_paths), 'unchanged_paths_checked': len(stable), 'changed_repository_paths': changes, 'checks': checks}
          (out/'live-verification.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          PY
      - name: Inspect public letter at mobile and desktop sizes
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out = Path('/tmp/letter-live'); results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),args=['--no-sandbox'])
              for width,height in [(390,844),(1440,1000)]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
                  errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                  response=page.goto('https://harperz9.github.io/checking-the-machines.html',wait_until='networkidle')
                  page.evaluate('document.fonts.ready')
                  assert response.status==200
                  assert page.locator('h1').inner_text()=='An Open Letter on Checking the Machines'
                  assert page.locator('h3[id^="note-"]').count()==13
                  assert page.locator('.letter-downloads a').count()==5
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth')
                  assert not errors,errors
                  page.screenshot(path=str(out/f'live-{width}-top.png'))
                  page.locator('#notes-and-sources').scroll_into_view_if_needed()
                  page.screenshot(path=str(out/f'live-{width}-notes.png'))
                  results.append({'width':width,'http_status':200,'page_errors':errors,'horizontal_overflow':False,'notes':13})
                  page.close()
              browser.close()
          (out/'live-browser.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checking-machines-live-verification
          path: /tmp/letter-live/
          retention-days: 14
