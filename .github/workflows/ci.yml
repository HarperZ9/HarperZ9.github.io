name: CI
on:
  pull_request:
permissions:
  contents: read
env:
  PLAYWRIGHT_VERSION: "1.62.1"
# Diagnostic only (not for merge): what the playground well does on a CI runner, with main's well.mjs and #567's.
jobs:
  ft-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
      - env:
          SITE_BASE_URL: http://127.0.0.1:8811
        run: |
          python tests/lib/serve.py 8811 . & sleep 2
          for v in main new main; do cp tests/_well-$v.mjs world/site/surfaces/well.mjs; cp tests/_fluid-$v.mjs world/studio/lib/fluid.mjs; cp tests/_pg-$v.html playground/index.html; echo "== $v"; BROWSER_CHANNEL=chrome node tests/frame-times.cjs 2>&1 | grep -E "frame-times: well|AssertionError" || true; done
