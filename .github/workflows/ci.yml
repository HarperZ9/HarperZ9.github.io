name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.62.1"

# Diagnostic only (not for merge): times surfaces-bench by section with #567's fluid solver and main's on one runner.
jobs:
  bench-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
      - name: Time the bench, PR solver, main solver, PR solver
        env:
          BROWSER_CHANNEL: chrome
          SITE_BASE_URL: http://127.0.0.1:8811
        run: |
          nproc; lscpu | grep -E "Model name|^CPU\(s\)"
          python tests/lib/serve.py 8811 . & sleep 2
          for v in pr main pr; do
            cp tests/_fluid-$v.mjs world/studio/lib/fluid.mjs
            echo "== $v"; s=$(date +%s)
            node tests/_bench-timed.cjs > /dev/null || echo "bench failed"
            echo "== $v total $(( $(date +%s) - s )) s"
          done
