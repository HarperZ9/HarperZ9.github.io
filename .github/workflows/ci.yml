name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 PyYAML==6.0.2 numpy==2.4.5 -r requirements-career-docs.txt -r requirements-font-preview.txt
      - name: Python content contracts
        run: python -m pytest
      - name: Navigation and font catalog contracts
        run: node --test system/nav.test.mjs tests/font-catalog.test.mjs tests/navigation-discovery.mjs tests/pillar-navigation.test.mjs tests/ident-tokens.test.mjs
      # The vendored superstack contract: the copy must hold its pinned SHA-256, and it must pass
      # the release's own vectors on this runner's Node.
      - name: Superstack contract pin and vectors
        if: ${{ !cancelled() }}
        run: |
          python tests/superstack/tools/check_vendored.py system/media-engine/contracts.mjs --expect "$(cut -d' ' -f1 system/media-engine/SUPERSTACK.sha256)"
          python tests/superstack/tools/check_vendored.py system/media-engine/contracts.mjs --sums tests/superstack/SHA256SUMS --as superstack.mjs
          node tests/superstack/tests/run_vectors.mjs --impl system/media-engine/contracts.mjs
          python tests/superstack/tools/check_vendored.py tools/superstack.py --expect "$(cut -d' ' -f1 tools/SUPERSTACK.sha256)"
          python tests/superstack/tools/check_vendored.py tools/superstack.py --sums tests/superstack/SHA256SUMS
          python tests/superstack/tests/run_vectors.py --impl tools/superstack.py
      # The media engine, its plugins, and every module that now takes its seed from it.
      - name: Media engine and renderer regressions
        if: ${{ !cancelled() }}
        run: >-
          node --test system/retro-crt.test.mjs system/generative-field.test.mjs system/retro-engine.test.mjs
          system/retro-studio.test.mjs system/hero-aperture.test.mjs system/media-engine/seed.test.mjs
          system/media-engine/colour.test.mjs system/plotter.test.mjs system/plot-bridge.test.mjs
          system/plot-compose.test.mjs system/plot-image-studies.test.mjs system/plot-maps.test.mjs
          system/sketch.test.mjs system/voxel-forge.test.mjs system/studio-shelf.test.mjs
          system/spatial-core.test.mjs system/engine/particles-cpu.test.mjs system/discovery/discovery.test.mjs
          system/discovery/noether.test.mjs system/showcase/showcase.test.mjs system/media-engine/page.test.mjs
          system/studio-loop.test.mjs system/media-engine/scene.test.mjs system/media-engine/core.test.mjs
          system/media-engine/raw.test.mjs system/media-engine/plate.test.mjs system/media-engine/sketch.test.mjs system/media-engine/plotmap.test.mjs system/media-engine/atelier.test.mjs system/media-engine/poster.test.mjs system/media-engine/voxels.test.mjs system/media-engine/fractal.test.mjs system/media-engine/showcase.test.mjs system/poster.test.mjs
          system/type-forge/forge.test.mjs system/typeface.test.mjs
          system/neural.test.mjs system/neural-kernels.test.mjs system/studio-neural.test.mjs
          system/studio-shell.test.mjs system/studio-keep.test.mjs system/studio-project.test.mjs system/studio-presets.test.mjs system/studio-dnd.test.mjs system/studio-layout.test.mjs system/studio-timeline.test.mjs
      # The sound layer (offline reference PCM pinned by hash, loudness, receipts) and the five
      # audio modules' own tests, which did not run in CI before.
      - name: Sound layer and audio regressions
        if: ${{ !cancelled() }}
        run: >-
          node --test system/media-engine/sound.test.mjs system/media-engine/sound-retro.test.mjs system/audio.test.mjs system/midi-writer.test.mjs
          system/studio-sound.test.mjs system/scope-voice.test.mjs system/ans-voice.test.mjs
      # The Python twins and the recorded-gate checks need numpy and scipy. Four tests need data
      # the repository does not carry (audit frames, the decoded image set, a Telos MCP checkout);
      # they skip with the reason printed. tests/telos-track-a/README.md has the full local run.
      - name: Telos measurement layers, receipts and their Python twins
        if: ${{ !cancelled() }}
        run: |
          python -m pip install numpy==2.4.5 scipy==1.17.1
          node --test tests/telos-track-a/*.test.mjs system/sense.test.mjs system/sense-parity.test.mjs system/audio-perceptual.test.mjs system/vision-biomimetic.test.mjs system/exporters.test.mjs system/importers.test.mjs system/media/ir.test.mjs shared-frame/tests/certificate.test.mjs shared-frame/tests/fidelity-log.test.mjs
      - name: Bulletin browser media and open work regressions
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          # Each suite launches Chrome; avoid competing browser startup on the runner.
          node --test --test-concurrency=1 system/bulletin-board.test.mjs system/bulletin-board-media-filter.test.mjs system/bulletin-work.test.mjs
      - name: Font marketplace browser regressions
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --no-save playwright@1.62.1
          python -m http.server 8802 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          SITE_BASE_URL=http://127.0.0.1:8802 BROWSER_CHANNEL=chrome node tests/font-original-preview.cjs
          SITE_BASE_URL=http://127.0.0.1:8802 BROWSER_CHANNEL=chrome node tests/font-marketplace-reading.cjs
      # Its own step, server and port, and it runs even when an earlier step failed, so
      # its pass or fail always shows on its own line.
      - name: Advisory IDs and package names on narrow screens
        if: ${{ !cancelled() }}
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --no-save playwright@1.62.1
          python -m http.server 8803 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          SITE_BASE_URL=http://127.0.0.1:8803 BROWSER_CHANNEL=chrome node tests/ident-narrow-reading.cjs
      # Every Gallery plate on screen at desktop and phone widths, and Plate 14 drawn. A reading
      # rule hid all 43 until 3 October 2026; tests/test_gallery_plates_visible.py is its static twin.
      - name: Gallery plates on screen
        if: ${{ !cancelled() }}
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --no-save playwright@1.62.1
          python -m http.server 8805 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          SITE_BASE_URL=http://127.0.0.1:8805 BROWSER_CHANNEL=chrome node tests/gallery-plates-visible.cjs
      # The 64 seeded plates and 95 instruments against tests/fixtures/plate-baselines.json (3 October
      # 2026): every plate on screen, drawn, backed at its layout size; each instrument repeats exactly.
      # The pixel hashes belong to the fixture's reference machine and are compared only there.
      - name: Plate baselines
        if: ${{ !cancelled() }}
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --no-save playwright@1.62.1
          python -m http.server 8806 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          SITE_BASE_URL=http://127.0.0.1:8806 BROWSER_CHANNEL=chrome node tests/plate-baselines.cjs 1 2
      # The Studio shell (4 October 2026): one source switch, the action bar on screen at desktop and
      # phone widths, each source's own frame on entry, work kept across a switch, exact pixels after
      # Undo and Redo, and every Showcase system re-checking to MATCH with its own terms. Then the
      # readings fold while making, work kept across a reload, Start fresh, and blocked storage.
      - name: Studio shell contract
        if: ${{ !cancelled() }}
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --no-save playwright@1.62.1
          python tests/lib/serve.py 8807 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-shell.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-keep.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-entry.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-controls.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-retro.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-bring.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-threads.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-worlds.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-films.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-link-entry.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-bar.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-plot.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-engines.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-spatial.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-instruments.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-gallery.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-loom.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-type.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-splats.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-films-source.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-choosing.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-palette.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-export-project.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-presets.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-drag-drop.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-layout.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-timeline.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-sound-engine.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-ndim-gpu.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-neural-gpu.cjs
          SITE_BASE_URL=http://127.0.0.1:8807 BROWSER_CHANNEL=chrome node tests/studio-music-attractor.cjs
      # The fractal renderers: the CPU reference, the GPU programs' source, deep zoom by perturbation
      # (reference orbit, BLA, rebasing, against direct BigInt iteration), then the deep path in the
      # browser (SwiftShader here) and in the Studio. Its own step and port, so it reports alone.
      - name: Fractal renderers, deep zoom, formulas, colouring and 3D
        if: ${{ !cancelled() }}
        run: |
          node --test system/fractal.test.mjs system/fractal-gl.test.mjs system/fractal-color.test.mjs system/fractal3d.test.mjs system/fractal-perturb.test.mjs system/fractal-hp.test.mjs system/fractal-formula.test.mjs system/fractal-gradient.test.mjs system/fractal3d-pro.test.mjs system/fractal-flight.test.mjs
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --no-save playwright@1.62.1
          python -m http.server 8809 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          SITE_BASE_URL=http://127.0.0.1:8809 BROWSER_CHANNEL=chrome node tests/fractal-deep.cjs
          SITE_BASE_URL=http://127.0.0.1:8809 BROWSER_CHANNEL=chrome node tests/studio-fractal-deep.cjs
          SITE_BASE_URL=http://127.0.0.1:8809 BROWSER_CHANNEL=chrome node tests/studio-fractal-formulas.cjs
          SITE_BASE_URL=http://127.0.0.1:8809 BROWSER_CHANNEL=chrome node tests/studio-fractal-colour.cjs
          SITE_BASE_URL=http://127.0.0.1:8809 BROWSER_CHANNEL=chrome node tests/studio-fractal-still.cjs
          SITE_BASE_URL=http://127.0.0.1:8809 BROWSER_CHANNEL=chrome node tests/studio-fractal3d.cjs
          SITE_BASE_URL=http://127.0.0.1:8809 BROWSER_CHANNEL=chrome node tests/studio-fractal-flight.cjs
      # The live explainers: spec hash MATCH, no network while a reader interacts, recall
      # diagnosis without the answer, and one still per step with reduced motion.
      # The long films: a byte-range server, and seeking from a source card or the transcript
      # opens no skipped questions while reaching a chapter end still does.
      - name: Live explainers in the browser
        if: ${{ !cancelled() }}
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --no-save playwright@1.62.1
          python tools/serve.py --port 8804 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          SITE_BASE_URL=http://127.0.0.1:8804 BROWSER_CHANNEL=chrome node tests/explainer-live.cjs
          SITE_BASE_URL=http://127.0.0.1:8804 BROWSER_CHANNEL=chrome node tests/explainer-films-seek.cjs
      - name: Internal link crawl
        run: |
          python -m http.server 8802 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          node tests/linkcheck.mjs

  # Windows leg for hash-pinned files: check out the way a default Git for Windows
  # install does, so a line-ending rewrite of a pinned file fails here instead of on a
  # reader's machine. It runs the same pin checks as the static-site job.
  pinned-bytes-windows:
    name: pinned bytes (windows-latest, core.autocrlf=true)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Use the Git for Windows line-ending default
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Superstack contract pins and Python vectors
        run: |
          python tests/superstack/tools/check_vendored.py system/media-engine/contracts.mjs --expect "$(cut -d' ' -f1 system/media-engine/SUPERSTACK.sha256)"
          python tests/superstack/tools/check_vendored.py system/media-engine/contracts.mjs --sums tests/superstack/SHA256SUMS --as superstack.mjs
          python tests/superstack/tools/check_vendored.py tools/superstack.py --expect "$(cut -d' ' -f1 tools/SUPERSTACK.sha256)"
          python tests/superstack/tools/check_vendored.py tools/superstack.py --sums tests/superstack/SHA256SUMS
          python tests/superstack/tests/run_vectors.py --impl tools/superstack.py
      - name: raw-native WebAssembly release matches its SHA256SUMS
        if: ${{ !cancelled() }}
        working-directory: media/raw-native/wasm-0.4.0
        run: sha256sum -c --strict SHA256SUMS
      - name: raw-native web GPU host matches its SHA256SUMS
        if: ${{ !cancelled() }}
        working-directory: media/raw-native/web-f2cd6e9
        run: sha256sum -c --strict SHA256SUMS
      - name: raw-native web host with Motion matches its SHA256SUMS
        if: ${{ !cancelled() }}
        working-directory: media/raw-native/web-23ec93f
        run: sha256sum -c --strict SHA256SUMS
      - name: raw-native web host with textures and the compositor matches its SHA256SUMS
        if: ${{ !cancelled() }}
        working-directory: media/raw-native/web-4edf976
        run: sha256sum -c --strict SHA256SUMS
      - name: raw-native sound engine matches its SHA256SUMS
        if: ${{ !cancelled() }}
        working-directory: media/raw-native/sound-4edf976
        run: sha256sum -c --strict SHA256SUMS
      - name: Sealed files are checked out byte for byte
        if: ${{ !cancelled() }}
        run: |
          git ls-files -s -- ":(attr:-text)" | while read -r mode sha stage path; do
            if [ "$(git hash-object --no-filters -- "$path")" != "$sha" ]; then
              echo "checkout rewrote a sealed file: $path"
              exit 1
            fi
          done
          echo "every sealed file matches its committed blob"
  art-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify art receipt digests
        run: python3 scripts/check_art_receipts.py
