<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Deterministic 1200 x 630 repository / social card on the Zentropy Labs
     design: minted ZentropyDisplay face, rhinoCase wordmark, oxblood-and-ice
     palette, a luminous halftone aperture-orb, grain + scanlines. Use ?f=<key>. -->
<style>
  @font-face{font-family:"ZentropyDisplay";src:url("../../brand/ZentropyDisplay.ttf") format("truetype");font-display:block}
  @font-face{font-family:"Conso";src:url("../../system/fonts/conso-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}
  @font-face{font-family:"Conso";src:url("../../system/fonts/conso-semibold.woff2") format("woff2");font-weight:600 700;font-style:normal;font-display:block}
  :root{--ink:#eaf5f6;--muted:#9fb6bb;--faint:#6b8288;--warm:#c86a44;--mono:"Conso",ui-monospace,monospace}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0a0709;color:var(--ink)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden}
  #bg{position:absolute;inset:0;z-index:0}
  .content{position:absolute;inset:0;z-index:2;padding:64px 72px 56px;display:flex;flex-direction:column}
  .frame{position:absolute;inset:26px;z-index:1;border:1px solid rgba(150,210,220,0.14);clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
  .metadata{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .metadata .dot{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#eafcff,#4ec4e0 55%,#1c6f86);flex:none;box-shadow:0 0 10px rgba(120,220,240,.8)}
  .metadata .role{color:var(--faint)}
  .word{margin-top:auto;font-family:"ZentropyDisplay",system-ui,sans-serif;font-variant:small-caps;font-feature-settings:"smcp";
        font-size:96px;line-height:.92;letter-spacing:.005em;color:#f2fbfc;text-shadow:0 0 26px rgba(120,210,235,.45);max-width:900px}
  .headline{margin-top:20px;font-family:var(--mono);font-size:27px;line-height:1.28;letter-spacing:.005em;color:var(--muted);max-width:820px}
  .pipeline{margin-top:24px;padding-top:20px;border-top:1px solid rgba(150,210,220,0.14);font-family:var(--mono);font-size:15px;letter-spacing:.10em;text-transform:uppercase;color:var(--faint)}
  .pipeline:empty{display:none}
  .glyph{position:absolute;right:76px;top:76px;z-index:2;width:96px;height:96px;display:grid;place-items:center;border:1px solid rgba(150,210,220,.22);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));font-family:var(--mono);font-size:54px;line-height:1;color:rgba(234,245,246,.86);text-shadow:0 0 18px rgba(120,220,240,.44);background:rgba(8,10,14,.32)}
  .glyph:empty{display:none}
  .site{position:absolute;right:72px;bottom:54px;z-index:2;font-family:"ZentropyDisplay",monospace;font-variant:small-caps;font-size:20px;letter-spacing:.03em;color:var(--muted)}
</style>
</head>
<body>
<main class="card" aria-label="Zentropy Labs repository card">
  <canvas id="bg" width="1200" height="630" aria-hidden="true"></canvas>
  <div class="frame" aria-hidden="true"></div>
  <div class="glyph" id="glyph" aria-hidden="true"></div>
  <div class="content">
    <div class="metadata"><span class="dot"></span><span>zentropy labs</span><span>/</span><span class="role" id="role"></span></div>
    <h1 class="word" id="word"></h1>
    <p class="headline" id="headline"></p>
    <p class="pipeline" id="pipeline"></p>
  </div>
  <div class="site">zentropyLabs</div>
</main>
<script src="cards-data.js?v=20260902-creative-chassis"></script>
<script>
(function(){
  var key=new URLSearchParams(location.search).get("f")||"buildlang";
  var fb={role:"Effects-oriented compiler",word:"buildlang",headline:"Typed effects in, verified C out.",pipeline:"LEX / PARSE / TYPE / EFFECTS / CODEGEN"};
  var data=(window.CARD_DATA&&window.CARD_DATA[key])||fb;
  function rhino(k){return k.split('-').map(function(w,i){return i===0?w:(w.charAt(0).toUpperCase()+w.slice(1));}).join('');}
  document.getElementById("role").textContent=(data.role||"Working system");
  // Prefer the word the data supplies. The template derived it from the key
  // and ignored data.word entirely, so every entry carried a field that did
  // nothing and a hyphenated key rendered as camelCase.
  document.getElementById("word").textContent=(data.word||rhino(key));
  document.getElementById("headline").textContent=data.headline||"A working tool in the portfolio.";
  document.getElementById("pipeline").textContent=data.pipeline||"";
  var glyphs={shield:"⬡",seal:"◉",ledger:"▤",aperture:"◌",braces:"{}",diamond:"◇",triad:"△",intake:"⌁",graph:"⌘",waveform:"∿",layers:"▧",spark:"✦",bracket:"⌜"};
  var glyph=document.getElementById("glyph");
  glyph.textContent=data.showGlyph?(glyphs[data.glyph]||"◇"):"";
  if(data.showGlyph)glyph.setAttribute("data-glyph",data.glyph||"diamond");

  // --- brand background: oxblood ground, halftone aperture-orb, grain, scanlines ---
  var c=document.getElementById("bg"),x=c.getContext("2d"),W=1200,Hh=630;
  function rnd(v){var s=Math.sin(v*127.1+311.7)*43758.545;return s-Math.floor(s);}
  var Ox=986,Oy=232,Or=176;
  // ground
  var bg=x.createRadialGradient(Ox,Oy,0,Ox,Oy,W*0.9);bg.addColorStop(0,'#1c0f14');bg.addColorStop(0.55,'#0c0709');bg.addColorStop(1,'#070508');x.fillStyle=bg;x.fillRect(0,0,W,Hh);
  var warm=x.createLinearGradient(0,Hh*0.5,0,Hh);warm.addColorStop(0,'rgba(150,58,40,0)');warm.addColorStop(1,'rgba(178,80,50,0.22)');x.fillStyle=warm;x.fillRect(0,0,W,Hh);
  // cool bloom behind orb
  var bl=x.createRadialGradient(Ox,Oy,0,Ox,Oy,Or*2.6);bl.addColorStop(0,'rgba(120,210,238,0.30)');bl.addColorStop(0.5,'rgba(56,150,190,0.10)');bl.addColorStop(1,'rgba(40,120,160,0)');x.fillStyle=bl;x.fillRect(0,0,W,Hh);
  // orb luminance -> halftone dots
  var oc=document.createElement('canvas');oc.width=W;oc.height=Hh;var o=oc.getContext('2d');
  var og=o.createRadialGradient(Ox,Oy,0,Ox,Oy,Or);og.addColorStop(0,'#fff');og.addColorStop(0.34,'#eee');og.addColorStop(0.64,'#888');og.addColorStop(0.87,'#262626');og.addColorStop(1,'#000');
  o.fillStyle=og;o.beginPath();o.arc(Ox,Oy,Or,0,7);o.fill();
  var od=o.getImageData(0,0,W,Hh).data,step=5,mR=step*0.74;
  var RAMP=[[12,22,30],[18,92,120],[60,176,204],[160,232,244],[248,255,255]];
  function ramp(L){var t=L*4,i=t<0?0:t>3?3:Math.floor(t),f=t-i,a=RAMP[i],b=RAMP[i+1];return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';}
  for(var yy=0;yy<Hh;yy+=step)for(var xx=0;xx<W;xx+=step){var L=od[((yy|0)*W+(xx|0))*4]/255;if(L<0.09)continue;x.fillStyle=ramp(L);x.beginPath();x.arc(xx+2.5,yy+2.5,mR*Math.pow(L,0.7),0,7);x.fill();}
  // flare
  x.strokeStyle='rgba(240,252,255,0.8)';x.lineWidth=1.4;x.beginPath();x.moveTo(Ox-Or*1.5,Oy);x.lineTo(Ox+Or*1.5,Oy);x.moveTo(Ox,Oy-Or*1.1);x.lineTo(Ox,Oy+Or*1.1);x.stroke();
  // scanlines
  x.fillStyle='rgba(4,6,10,0.26)';for(var sy=0;sy<Hh;sy+=3)x.fillRect(0,sy,W,1);
  // grain
  try{var g=x.getImageData(0,0,W,Hh),gd=g.data;for(var p=0;p<gd.length;p+=4){var n=(rnd(p*0.317)-0.5)*26;gd[p]+=n;gd[p+1]+=n;gd[p+2]+=n;}x.putImageData(g,0,0);}catch(e){}

  document.fonts.ready.then(function(){requestAnimationFrame(function(){document.documentElement.setAttribute("data-ready","1");});});
  setTimeout(function(){document.documentElement.setAttribute("data-ready","1");},1200);
})();
</script>
</body>
</html>
