<!doctype html>
<html><head><meta charset="utf-8"><title>fx probe</title>
<style>
  body{background:#0b0d10;color:#cfd6dd;font:12px ui-monospace,monospace;margin:0;padding:12px}
  .g{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .c{border:1px solid #2a2f36;border-radius:8px;overflow:hidden;background:#07080b}
  .c .a{position:relative;aspect-ratio:16/10}
  .c canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .lab{padding:6px 8px;color:#8d99a6;font-size:11px}
</style></head>
<body>
<div class="g" id="g"></div>
<script type="module">
import { mountSpecimens } from "./system/generative-field.js";
const SET = JSON.parse(new URLSearchParams(location.search).get("set") || "[]");
const g = document.getElementById("g");
for (const s of SET) {
  const d = document.createElement("div"); d.className = "c";
  d.innerHTML = `<div class="a"><canvas data-specimen="${s.seed}" data-specimen-layers="${s.layers}"
    ${s.fx ? `data-specimen-fx="${s.fx}" data-specimen-fx-amount="${s.amt}"` : ""}></canvas></div>
    <div class="lab">${s.layers} ${s.fx ? "// " + s.fx + " @" + s.amt : ""} // ${s.seed}</div>`;
  g.appendChild(d);
}
mountSpecimens(document);
setTimeout(() => { document.title = "ready"; }, 1200);
</script>
</body></html>
