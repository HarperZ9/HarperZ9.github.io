        <p style="max-width:42rem;line-height:1.6">Install Flywheel and run a check on your own machine, browse the other tools, or read the newest writing.</p>

        <section id="noscript-mission" aria-labelledby="noscript-mission-title">
          <h2 id="noscript-mission-title" style="font-size:1.35rem;line-height:1.2;margin:2rem 0 .5rem">Flagship tools</h2>
          <p style="max-width:42rem;line-height:1.6">Five tools you can try in a few minutes.</p>
          <ul style="line-height:1.8">
            <li><a style="color:#8ee3f2" href="/flywheel.html">Flywheel</a>: catch a wrong answer before your team acts on it. Install: pip install <span class="ident" translate="no">flywheel-verify</span></li>
            <li><a style="color:#8ee3f2" href="https://harperz9.github.io/cmmns/install.html">CMMNS</a>: see who is behind a reply on nine social platforms before you believe it.</li>
            <li><a style="color:#8ee3f2" href="/articulate.html">Articulate</a>: find the filler in your writing, line by line. Install: pip install <span class="ident" translate="no">articulate-writing</span></li>
            <li><a style="color:#8ee3f2" href="/buildlang.html">BuildLang</a>: know what a program can touch before it runs. Install: cargo install buildlang</li>
            <li><a style="color:#8ee3f2" href="/raw.html">raw-native</a>: one renderer, the same frame on the CPU, D3D12 and the web.</li>
          </ul>
        </section>

          <ul style="line-height:1.8">

        <section id="noscript-flywheel" aria-labelledby="noscript-flywheel-title">
          <h2 id="noscript-flywheel-title" style="font-size:1.35rem;line-height:1.2;margin:2rem 0 .5rem">Flagship platform: Flywheel</h2>
          <p data-canonical-purpose="flywheel" style="max-width:42rem;line-height:1.6">Flywheel runs AI tasks with the model you choose and checks each answer against the task contract. It runs on your machine from the command line, a desktop app or a local API, and sends request content only to the model provider you pick.</p>
          <ul style="line-height:1.8">
            <li>Release: <a href="https://github.com/HarperZ9/flywheel/releases/tag/v1.9.0">Flywheel 1.9.0</a>, with the Windows installer attached</li>
            <li>Install: pip install <span class="ident" translate="no">flywheel-verify</span></li>
            <li>Run: flywheel up</li>
            <li>Check: flywheel lanes --probe</li>
          </ul>
          <p style="line-height:2">
            <a style="color:#8ee3f2" href="/flywheel.html">Open Flywheel</a>
            <a style="color:#8ee3f2;margin-left:1rem" href="/career/Flywheel-Platform-Brief.pdf">Read the platform brief</a>
            <a style="color:#8ee3f2;margin-left:1rem" href="https://github.com/HarperZ9/flywheel">Source</a>
          </p>
        </section>

        <section id="noscript-products" aria-labelledby="noscript-products-title">
          <h2 id="noscript-products-title" style="font-size:1.35rem;line-height:1.2;margin:2rem 0 .5rem">Built tooling ecosystem</h2>
          <p style="max-width:42rem;line-height:1.6">Tools you can install and run.</p>
          <ul style="line-height:1.8">
            <li><a style="color:#8ee3f2" href="/gather.html">Gather</a><br><span data-canonical-purpose="gather">Gather collects research material from web pages, including JavaScript-rendered ones, APIs, scholarly records, PDFs, scans, audio, video, feeds and local files. It saves each item with its source in a local corpus you can search and verify.</span></li>
            <li><a style="color:#8ee3f2" href="/crucible.html">Crucible</a><br><span data-canonical-purpose="crucible">Crucible is test infrastructure for claims about AI systems. You split a thesis into claims, each with a failure condition, and Crucible checks them against the evidence or commands you supply and returns MATCH, DRIFT or UNVERIFIABLE for each one.</span></li>
            <li><a style="color:#8ee3f2" href="/index-graph.html">Index</a><br><span data-canonical-purpose="index">Index maps a repository or a multi-repo workspace from its manifests, imports, symbols and docs. It builds offline wikis, dependency maps, context packets for agents and architecture checks, each pointing to a file and line. Large workspaces can run as background jobs you check on later.</span></li>
            <li><a style="color:#8ee3f2" href="/forum.html">Forum</a><br><span data-canonical-purpose="forum">Forum runs teams of AI agents. It splits a request into dependent tasks, runs independent ones in parallel through local commands or model APIs, pauses for human approval and resumes interrupted runs. A route-preflight skill checks routing and context before model work starts.</span></li>
            <li><a style="color:#8ee3f2" href="/emet.html">EMET</a><br><span data-canonical-purpose="emet">EMET checks whether the bytes that reach a model, reviewer or pipeline still match their source. It anchors content, compares it later, neutralizes instructions embedded in it, and writes a verdict file that its Python, Rust, Node and Go implementations all read the same way.</span></li>
            <li><a style="color:#8ee3f2" href="/systems/relay.html">Relay</a><br><span data-canonical-purpose="relay">Relay runs a coding agent across local models, subscription CLIs, APIs, gateways and cloud endpoints. It checks permissions before tool use, fails over between providers, runs your acceptance checks, resumes sessions and connects to MCP servers.</span></li>
            <li><a style="color:#8ee3f2" href="/systems/mneme.html">Mneme</a><br><span data-canonical-purpose="mneme">Mneme is a SQLite memory store for AI agents, with a CLI and an MCP server. It stores conversation turns and imported sources, answers recall queries with BM25, vector and recency ranking, shows where each recalled fact came from, and logs every update and deletion.</span></li>
            <li><a style="color:#8ee3f2" href="/systems/plexus.html">Plexus</a><br><span data-canonical-purpose="plexus">Plexus finds which of your agent tools can feed each other. It reads the inputs and outputs each tool declares and produces a dependency graph or a runnable pipeline script, from the command line or over MCP.</span></li>
            <li><a style="color:#8ee3f2" href="/proof-surface.html">Proof Surface</a><br><span data-canonical-purpose="proof-surface">Proof Surface is a Python library and telos-proof CLI that validates records of AI workflow steps, authorizations, delegations and finished work, and returns allow, deny or needs-human recommendations. It never runs the action itself.</span></li>
            <li><a style="color:#8ee3f2" href="/accountable-surface.html">Accountable Surface</a><br><span data-canonical-purpose="accountable-surface">Accountable Surface lets an AI agent take only the file, command, web or browser actions a person has approved. It checks each request, blocks or pauses when needed, checks the outcome, rolls back reversible failures, and keeps a hash-chained journal of decisions and outcomes.</span></li>
          </ul>
          <p style="line-height:2"><a style="color:#8ee3f2" href="/catalog.html">Full product catalog</a></p>
